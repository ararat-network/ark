syntax = "proto3";
package noah.market.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "noah/market/v1/market.proto";

// GenesisState defines the market module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [ (amino.dont_omitempty) = true ];

  // the gap between the NoahPool and the BasePool
  string noah_pool_delta = 2 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
}
