syntax = "proto3";
package noah.oracle.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "noah/x/oracle/types";

// Params defines the parameters for the oracle module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "noah/x/oracle/Params";

  uint64 vote_period = 1;
  string vote_threshold = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string reward_band = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 reward_distribution_window = 4;
  repeated TobinTax tobin_taxes = 5 [
    (gogoproto.castrepeated) = "TobinTaxes",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string slash_fraction = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 slash_window = 7;
  string min_valid_per_window = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// TobinTax - the object to hold configurations of each denom
message TobinTax {
  option (gogoproto.equal) = true;

  string denom = 1;
  string tobin_tax = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Prevote is a struct for aggregate prevoting on the Vote.
// The purpose of aggregate prevote is to hide vote exchange rates with hash
// which is formatted as hex string in SHA256("{salt}:{exchange
// rate}{denom},...,{exchange rate}{denom}:{voter}")
message Prevote {
  string hash = 1;
  string voter = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 submit_block = 3;
}

// Vote - struct for voting on
// the exchange rates of Ark denominated in various Noah assets.
message Vote {
  repeated ExchangeRate exchange_rates = 1 [
    (gogoproto.castrepeated) = "ExchangeRates",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  string voter = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// ExchangeRate - struct to store interpreted exchange rates data to store
message ExchangeRate {
  string denom = 1;
  string rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // BlockTimestamp tracks the block height associated with this price update.
  // We include block timestamp alongside the price to ensure that smart
  // contracts and applications are not utilizing stale oracle prices
  google.protobuf.Timestamp block_timestamp = 3
      [ (gogoproto.nullable) = false, (gogoproto.stdtime) = true ];

  // BlockHeight is height of block mentioned above
  uint64 block_height = 4;
}
