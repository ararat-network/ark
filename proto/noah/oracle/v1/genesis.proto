syntax = "proto3";
package noah.oracle.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "noah/oracle/v1/oracle.proto";

option go_package = "noah/x/oracle/types";

// GenesisState defines the oracle module's genesis state.
message GenesisState {
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated FeederDelegation feeder_delegations = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated ExchangeRate exchange_rates = 3 [
    (gogoproto.castrepeated) = "ExchangeRates",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated MissCount miss_counts = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated Prevote prevotes = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated Vote votes = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated TobinTax tobin_taxes = 7
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// FeederDelegation is the address for where oracle feeder authority are
// delegated to. By default this struct is only used at genesis to feed in
// default feeder addresses.
message FeederDelegation {
  string feeder_address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string validator_address = 2
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
}

// MissCounts defines a miss count and validator address pair used in
// oracle module's genesis state
message MissCount {
  string validator_address = 1
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
  uint64 miss_count = 2;
}
