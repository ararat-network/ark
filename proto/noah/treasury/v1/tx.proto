syntax = "proto3";
package noah.treasury.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "noah/treasury/v1/treasury.proto";

option go_package = "noah/x/treasury/types";

// Msg defines the market Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // TODO add description once i know what this exactly does
  rpc AddBurnTaxExemptionAddress(MsgAddBurnTaxExemptionAddress)
      returns (MsgAddBurnTaxExemptionAddressResponse);

  // TODO add description once i know what this exactly does
  rpc RemoveBurnTaxExemptionAddress(MsgRemoveBurnTaxExemptionAddress)
      returns (MsgRemoveBurnTaxExemptionAddressResponse);

  // UpdateParams defines an operation for updating the x/treasury module
  // parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}
}

// MsgAddBurnTaxExemptionAddress represents a message to add an exemption
// address.
message MsgAddBurnTaxExemptionAddress {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "noah/x/treasury/MsgAddBurnTaxExemptionAddress";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  repeated string addresses = 2;
}

// MsgAddBurnTaxExemptionAddressResponse defines the response structure for
// executing a MsgAddBurnTaxExemptionAddress message.
message MsgAddBurnTaxExemptionAddressResponse {}

// MsgRemoveBurnTaxExemptionAddress represents a message to remove an exemption
// address.
message MsgRemoveBurnTaxExemptionAddress {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "noah/x/treasury/MsgRemoveBurnTaxExemptionAddress";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  repeated string addresses = 2;
}

// MsgRemoveBurnTaxExemptionAddressResponse defines the response structure for
// executing a MsgRemoveBurnTaxExemptionAddress message.
message MsgRemoveBurnTaxExemptionAddressResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "noah/x/treasury/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the x/market parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}
