syntax = "proto3";
package noah.treasury.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "noah/x/treasury/types";

// Params defines the parameters for the treasury module.
message Params {
  option (amino.name) = "noah/x/treasury/Params";

  PolicyConstraints tax_policy = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  PolicyConstraints reward_policy = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string seigniorage_burden_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string mining_increment = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 window_short = 5 [(amino.dont_omitempty) = true];
  uint64 window_long = 6 [(amino.dont_omitempty) = true];
  uint64 window_probation = 7 [(amino.dont_omitempty) = true];
  string burn_tax_split = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string min_initial_deposit_ratio = 9 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// PolicyConstraints - defines policy constraints can be applied in tax & reward
// policies
message PolicyConstraints {
  string rate_min = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string rate_max = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  cosmos.base.v1beta1.Coin cap = 3 [(gogoproto.nullable) = false];
  string change_rate_max = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
