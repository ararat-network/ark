syntax = "proto3";
// SPDX-License-Identifier: Apache-2.0
// Originates from Ark's Terra Classic port of proto/terra/oracle/v1beta1/tx.proto.
// Modified for Ark: oracle schema and modern SDK integration.
// See NOTICE and THIRD_PARTY_NOTICES.md for upstream attribution.
package ark.oracle.v1;

import "amino/amino.proto";
import "ark/oracle/v1/oracle.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/oracle/types";

// Msg defines the oracle Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines an operation for updating the x/oracle module
  // parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}

  // AddFeed schedules the addition of one price feed to the active feed set.
  rpc AddFeed(MsgAddFeed) returns (MsgAddFeedResponse) {}

  // RemoveFeed schedules the removal of one price feed from the active feed
  // set.
  rpc RemoveFeed(MsgRemoveFeed) returns (MsgRemoveFeedResponse) {}

  // SetReferenceDenom re-points the shared protocol reference denomination,
  // rebasing consumer reference-unit state when it changes.
  rpc SetReferenceDenom(MsgSetReferenceDenom) returns (MsgSetReferenceDenomResponse) {}
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/oracle/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the x/oracle parameters to update.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgAddFeed schedules membership in the active feed set. Already active or scheduled additions are
// idempotent.
message MsgAddFeed {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/oracle/MsgAddFeed";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // denom keys the feed to add.
  string denom = 2;
}

// MsgAddFeedResponse defines the response structure for executing a MsgAddFeed
// message.
message MsgAddFeedResponse {}

// MsgRemoveFeed schedules one feed removal.
message MsgRemoveFeed {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/oracle/MsgRemoveFeed";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // denom keys the feed to remove.
  string denom = 2;
}

// MsgRemoveFeedResponse defines the response structure for executing a
// MsgRemoveFeed message.
message MsgRemoveFeedResponse {}

// MsgSetReferenceDenom changes the shared reference and atomically rebases Market and Treasury
// state. An established reference cannot be cleared.
message MsgSetReferenceDenom {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/oracle/MsgSetReferenceDenom";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // reference_denom keys the feed the reference unit is priced from.
  string reference_denom = 2;
  // outgoing_rate optionally supplies NOAH per outgoing-reference unit, replacing its Oracle read
  // entirely. Absent or zero uses the ordinary fresh rate. An explicit rate permits rebasing from
  // an unpriced or stale outgoing feed; the successor still requires fresh pricing.
  string outgoing_rate = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgSetReferenceDenomResponse is the response type for MsgSetReferenceDenom.
message MsgSetReferenceDenomResponse {}
