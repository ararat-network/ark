syntax = "proto3";
package ark.oracle.v1;

import "amino/amino.proto";
import "ark/oracle/v1/oracle.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "ark/x/oracle/types";

// GenesisState defines the oracle module's genesis state.
message GenesisState {
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated ExchangeRate exchange_rates = 2 [
    (gogoproto.castrepeated) = "ExchangeRates",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated RewardWeight reward_weights = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated MissCount miss_counts = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  VoteTargets vote_targets = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  Accounting accounting = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// Accounting defines the active reward and slashing periods. Params may
// contain newly approved windows while accounting finishes the current period.
message Accounting {
  uint64 reward_window = 1;
  uint64 reward_distribution_window = 2;
  uint64 reward_window_start_height = 3;
  uint64 slash_window = 4;
  uint64 slash_window_start_height = 5;
}

// VoteTargets defines the staged denoms validators should report.
message VoteTargets { repeated string denoms = 1; }

// ExchangeRate - struct to store interpreted exchange rates data to store
message ExchangeRate {
  string denom = 1;
  string rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // BlockTimestamp tracks the block time associated with this price update.
  // We include block timestamp alongside the price to ensure that smart
  // contracts and applications are not utilizing stale oracle prices
  google.protobuf.Timestamp block_timestamp = 3
      [ (gogoproto.nullable) = false, (gogoproto.stdtime) = true ];

  // BlockHeight is height of block mentioned above
  uint64 block_height = 4;
}

// RewardWeight defines a reward-distribution weight and validator address pair
// used in oracle module's genesis state
message RewardWeight {
  string validator_address = 1
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
  string reward_weight = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MissCount defines a miss count and validator address pair used in
// oracle module's genesis state
message MissCount {
  string validator_address = 1
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
  uint64 miss_count = 2;
}
