syntax = "proto3";
package ark.oracle.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "ark/x/oracle/types";

// Params defines the parameters for the oracle module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/x/oracle/Params";

  string vote_threshold = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string reward_band = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Window changes take effect after the active reward period settles.
  uint64 reward_window = 3;
  // Distribution window changes take effect with reward window accounting at
  // the end of the active reward period.
  uint64 reward_distribution_window = 4;
  repeated TobinTax tobin_taxes = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string slash_fraction = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Window changes take effect after the active slash period settles.
  uint64 slash_window = 7;
  string min_valid_per_window = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // max_exchange_rate_age is the maximum elapsed block time since an exchange
  // rate was last written before it is considered stale.
  google.protobuf.Duration max_exchange_rate_age = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (amino.dont_omitempty) = true
  ];
}

// TobinTax - the object to hold configurations of each denom
message TobinTax {
  option (gogoproto.equal) = true;

  string denom = 1;
  string tobin_tax = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// VoteTargets defines the active vote-target epoch and an optional scheduled
// replacement. Pending targets become authoritative for vote extensions at
// activation_vote_height.
message VoteTargets {
  repeated string denoms = 1;
  uint64 version = 2;
  PendingVoteTargets pending = 3;
}

// PendingVoteTargets defines a scheduled vote-target epoch.
message PendingVoteTargets {
  repeated string denoms = 1;
  uint64 version = 2;
  int64 activation_vote_height = 3;
}
