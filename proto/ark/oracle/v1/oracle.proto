syntax = "proto3";
package ark.oracle.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/ararat-network/ark/x/oracle/types";

// Params defines the parameters for the oracle module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/oracle/Params";

  string vote_threshold = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string reward_band = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Window changes take effect after the active reward period settles.
  uint64 reward_window = 3;
  // Distribution window changes take effect with reward window accounting at
  // the end of the active reward period.
  uint64 reward_distribution_window = 4;
  // Window changes take effect after the active attendance period settles.
  uint64 attendance_window = 5;
  // min_attendance_per_window is the minimum attended/eligible ratio over one
  // attendance window before a validator is jailed. Zero disables jailing.
  string min_attendance_per_window = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // max_exchange_rate_age bounds elapsed block time since the last rate update for ordinary
  // reads. Consumers using GetRateSetWithin supply their own freshness windows.
  google.protobuf.Duration max_exchange_rate_age = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (amino.dont_omitempty) = true
  ];
  // functioning_block_threshold is the minimum participating share of commit power required to
  // grade attendance, bounded to [0.5, 1]. Higher thresholds make grading more forgiving during
  // correlated outages.
  string functioning_block_threshold = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // participation_threshold is the positive-rate share of vote-height targets required for
  // attendance and functioning-block power. Zero still requires one rate; the maximum is 0.5.
  // Coverage beyond this floor is rewarded per target.
  string participation_threshold = 9 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Feeds defines the materialised active feed set and any scheduled per-feed
// transitions not yet activated. The feed set for a vote height is the active
// set folded with every transition whose activation height has arrived.
message Feeds {
  // denoms is the sorted, unique active feed set. Feeds use the denominations they price, whether
  // or not those denominations are registered assets.
  repeated string denoms = 1;
  // version advances once per activation batch.
  uint64 version = 2 [(amino.dont_omitempty) = true];
  // transitions are scheduled membership changes, sorted by
  // (activation_vote_height, denom). Immutable once written.
  repeated FeedTransition transitions = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// FeedTransition is one scheduled membership change for one feed. Immutable
// once written.
message FeedTransition {
  string denom = 1;
  FeedDirection direction = 2 [(amino.dont_omitempty) = true];
  int64 activation_vote_height = 3 [(amino.dont_omitempty) = true];
}

// FeedReferent is one consumer claim on a feed, derived from the consumer's
// own state at the moment it is asked. Claims are never stored: a referent
// exists exactly while the consumer state that implies it does.
message FeedReferent {
  // consumer names the module holding the claim.
  string consumer = 1;
  // referent describes the claim in the consumer's own terms. It is prose for
  // operators and proposal authors, not a machine contract, which is why this
  // query is not module-query-safe.
  string referent = 2;
}

// FeedDirection identifies whether a transition adds or removes a feed.
enum FeedDirection {
  // FEED_DIRECTION_UNSPECIFIED is not a valid persisted direction.
  FEED_DIRECTION_UNSPECIFIED = 0;
  // FEED_DIRECTION_ADD schedules a feed to join the active set at its
  // activation height.
  FEED_DIRECTION_ADD = 1;
  // FEED_DIRECTION_REMOVE schedules a feed to leave the active set at its
  // activation height.
  FEED_DIRECTION_REMOVE = 2;
}

// Attendance counts eligible and attended functioning blocks in the current window. A commit
// validator is eligible when fleet participation meets the threshold and attended when its own
// report meets the target-coverage floor.
message Attendance {
  uint64 eligible_blocks = 1;
  uint64 attended_blocks = 2;
}
