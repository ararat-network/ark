syntax = "proto3";
// SPDX-License-Identifier: Apache-2.0
// Originates from Ark's Terra Classic port of proto/terra/oracle/v1beta1/query.proto.
// Modified for Ark: oracle schema and modern SDK integration.
// See NOTICE and THIRD_PARTY_NOTICES.md for upstream attribution.
package ark.oracle.v1;

import "amino/amino.proto";
import "ark/oracle/v1/oracle.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/ararat-network/ark/x/oracle/types";

// Query defines the gRPC querier service.
service Query {
  // ExchangeRate returns exchange rate of a denom
  rpc ExchangeRate(QueryExchangeRateRequest) returns (QueryExchangeRateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/{denom}/exchange_rate";
  }

  // ExchangeRates returns exchange rates of all denoms
  rpc ExchangeRates(QueryExchangeRatesRequest) returns (QueryExchangeRatesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/exchange_rates";
  }

  // Feeds returns the active feed set and scheduled transitions.
  rpc Feeds(QueryFeedsRequest) returns (QueryFeedsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/feeds";
  }

  // FeedReferents returns removal-blocking consumer claims, or NotFound for an absent feed. It is
  // not module_query_safe: descriptions are operator-facing prose whose wording is outside the
  // consensus query contract.
  rpc FeedReferents(QueryFeedReferentsRequest) returns (QueryFeedReferentsResponse) {
    option (google.api.http).get = "/ark/oracle/v1/feeds/{denom}/referents";
  }

  // ReferenceDenom returns the denomination whose feed is the shared protocol
  // reference unit.
  rpc ReferenceDenom(QueryReferenceDenomRequest) returns (QueryReferenceDenomResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/reference_denom";
  }

  // RewardWeight returns a validator's accumulated oracle reward weight.
  rpc RewardWeight(QueryRewardWeightRequest) returns (QueryRewardWeightResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/validators/{validator_addr}/reward_weight";
  }

  // Attendance returns a validator's in-progress oracle attendance counters.
  rpc Attendance(QueryAttendanceRequest) returns (QueryAttendanceResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/validators/{validator_addr}/attendance";
  }

  // Params queries all parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/params";
  }
}

// QueryExchangeRateRequest is the request type for the Query/ExchangeRate RPC
// method.
message QueryExchangeRateRequest {
  // denom defines the denomination to query for.
  string denom = 1;
}

// QueryExchangeRateResponse is response type for the
// Query/ExchangeRate RPC method.
message QueryExchangeRateResponse {
  // exchange_rate is the stored rate of the queried denomination, NOAH per
  // one unit.
  string exchange_rate = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // units_per_noah is the same rate read the other way round — units of the
  // denomination one NOAH buys — derived for reading, never stored or
  // consumed by the chain. Zero when the reciprocal is below Dec precision,
  // which only a rate near the store bound produces.
  string units_per_noah = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryExchangeRatesRequest is the request type for the Query/ExchangeRates RPC
// method.
message QueryExchangeRatesRequest {}

// ExchangeRateReading is one fresh rate in both readings: the stored figure
// and its reciprocal, on one line, so a reader never has to invert by eye.
message ExchangeRateReading {
  // denom is the feed key the rate prices.
  string denom = 1;
  // exchange_rate is the stored rate, NOAH per one unit of denom.
  string exchange_rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // units_per_noah is the reciprocal, derived for reading exactly as in
  // QueryExchangeRateResponse.
  string units_per_noah = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryExchangeRatesResponse is response type for the
// Query/ExchangeRates RPC method.
message QueryExchangeRatesResponse {
  // exchange_rates lists every fresh rate in denomination order, each in
  // both readings.
  repeated ExchangeRateReading exchange_rates = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryFeedsRequest is the request type for the Query/Feeds RPC method.
message QueryFeedsRequest {}

// QueryFeedsResponse is the response type for the Query/Feeds RPC method.
message QueryFeedsResponse {
  // feeds defines the active feed set and any scheduled transitions.
  Feeds feeds = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryFeedReferentsRequest is the request type for the Query/FeedReferents
// RPC method.
message QueryFeedReferentsRequest {
  // denom identifies the feed to report referents for.
  string denom = 1;
}

// QueryFeedReferentsResponse is the response type for the Query/FeedReferents
// RPC method.
message QueryFeedReferentsResponse {
  // referents lists every claim consumers hold on the feed. Empty means no
  // consumer blocks removal. Unpaginated: the count is bounded by consumers
  // times claims per consumer.
  repeated FeedReferent referents = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryReferenceDenomRequest is the request type for the Query/ReferenceDenom
// RPC method.
message QueryReferenceDenomRequest {}

// QueryReferenceDenomResponse is the response type for the
// Query/ReferenceDenom RPC method.
message QueryReferenceDenomResponse {
  // reference_denom keys the feed serving as the protocol reference. Empty
  // only before governance has ever configured one.
  string reference_denom = 1;
}

// QueryRewardWeightRequest is the request type for the Query/RewardWeight RPC
// method.
message QueryRewardWeightRequest {
  // validator defines the validator address to query for.
  string validator_addr = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryRewardWeightResponse is response type for the
// Query/RewardWeight RPC method.
message QueryRewardWeightResponse {
  // reward_weight defines the validator's accumulated oracle reward weight.
  string reward_weight = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryAttendanceRequest is the request type for the Query/Attendance RPC
// method.
message QueryAttendanceRequest {
  // validator defines the validator address to query for.
  string validator_addr = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

// QueryAttendanceResponse is response type for the Query/Attendance RPC
// method.
message QueryAttendanceResponse {
  Attendance attendance = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
