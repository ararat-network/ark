syntax = "proto3";
package ark.oracle.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "ark/oracle/v1/oracle.proto";

option go_package = "ark/x/oracle/types";

// Query defines the gRPC querier service.
service Query {
  // ExchangeRate returns exchange rate of a denom
  rpc ExchangeRate(QueryExchangeRateRequest)
      returns (QueryExchangeRateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get =
        "/ark/oracle/v1/denoms/{denom}/exchange_rate";
  }

  // ExchangeRates returns exchange rates of all denoms
  rpc ExchangeRates(QueryExchangeRatesRequest)
      returns (QueryExchangeRatesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/exchange_rates";
  }

  // TobinTax returns tobin tax of a denom
  rpc TobinTax(QueryTobinTaxRequest) returns (QueryTobinTaxResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/{denom}/tobin_tax";
  }

  // TobinTaxes returns tobin taxes of all denoms
  rpc TobinTaxes(QueryTobinTaxesRequest) returns (QueryTobinTaxesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/tobin_taxes";
  }

  // VoteTargets returns all vote target denoms
  rpc VoteTargets(QueryVoteTargetsRequest) returns (QueryVoteTargetsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/denoms/vote_targets";
  }

  // RewardWeight returns a validator's accumulated oracle reward weight.
  rpc RewardWeight(QueryRewardWeightRequest)
      returns (QueryRewardWeightResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get =
        "/ark/oracle/v1/validators/{validator_addr}/reward_weight";
  }

  // Attendance returns a validator's in-progress oracle attendance counters.
  rpc Attendance(QueryAttendanceRequest) returns (QueryAttendanceResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get =
        "/ark/oracle/v1/validators/{validator_addr}/attendance";
  }

  // Params queries all parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/oracle/v1/params";
  }
}

// QueryExchangeRateRequest is the request type for the Query/ExchangeRate RPC
// method.
message QueryExchangeRateRequest {
  // denom defines the denomination to query for.
  string denom = 1;
}

// QueryExchangeRateResponse is response type for the
// Query/ExchangeRate RPC method.
message QueryExchangeRateResponse {
  // exchange_rate defines the exchange rate of noah denominated in various ark
  string exchange_rate = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryExchangeRatesRequest is the request type for the Query/ExchangeRates RPC
// method.
message QueryExchangeRatesRequest {}

// QueryExchangeRatesResponse is response type for the
// Query/ExchangeRates RPC method.
message QueryExchangeRatesResponse {
  // exchange_rates defines a list of the exchange rate for all whitelisted
  // denoms.
  repeated cosmos.base.v1beta1.DecCoin exchange_rates = 1 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryTobinTaxRequest is the request type for the Query/TobinTax RPC method.
message QueryTobinTaxRequest {
  // denom defines the denomination to query for.
  string denom = 1;
}

// QueryTobinTaxResponse is response type for the
// Query/TobinTax RPC method.
message QueryTobinTaxResponse {
  // tobin_tax defines the tobin tax of a denom
  string tobin_tax = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryTobinTaxesRequest is the request type for the Query/TobinTaxes RPC
// method.
message QueryTobinTaxesRequest {}

// QueryTobinTaxesResponse is response type for the
// Query/TobinTaxes RPC method.
message QueryTobinTaxesResponse {
  // tobin_taxes defines a list of all the denoms and their respective tobin tax
  repeated TobinTax tobin_taxes = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryVoteTargetsRequest is the request type for the Query/VoteTargets RPC
// method.
message QueryVoteTargetsRequest {}

// QueryVoteTargetsResponse is response type for the
// Query/VoteTargets RPC method.
message QueryVoteTargetsResponse {
  // vote_targets defines a list of the denomination in which everyone
  // should vote in the active vote-target epoch.
  repeated string vote_targets = 1;
  // target_version identifies the active vote-target epoch.
  uint64 target_version = 2;
  // pending defines the next scheduled vote-target epoch, when present.
  PendingVoteTargets pending = 3;
}

// QueryRewardWeightRequest is the request type for the Query/RewardWeight RPC
// method.
message QueryRewardWeightRequest {
  // validator defines the validator address to query for.
  string validator_addr = 1
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
}

// QueryRewardWeightResponse is response type for the
// Query/RewardWeight RPC method.
message QueryRewardWeightResponse {
  // reward_weight defines the validator's accumulated oracle reward weight.
  string reward_weight = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryAttendanceRequest is the request type for the Query/Attendance RPC
// method.
message QueryAttendanceRequest {
  // validator defines the validator address to query for.
  string validator_addr = 1
      [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
}

// QueryAttendanceResponse is response type for the Query/Attendance RPC
// method.
message QueryAttendanceResponse {
  Attendance attendance = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
