syntax = "proto3";

package ark.oracle.module.v1;

import "cosmos/app/v1alpha1/module.proto";

// Module is the config object for the oracle module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/ararat-network/ark/x/oracle/module"};

  // distribution_name names the module account oracle rewards are paid into
  // for allocation to validators. If not set, defaults to "distribution".
  string distribution_name = 1;
}
