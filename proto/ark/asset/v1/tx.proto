syntax = "proto3";
package ark.asset.v1;

import "amino/amino.proto";
import "ark/asset/v1/asset.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/asset/types";

// Msg defines the asset Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates the governance-owned asset module parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}
  // RegisterAsset registers a new governance-managed Bank asset.
  rpc RegisterAsset(MsgRegisterAsset) returns (MsgRegisterAssetResponse) {}
  // HaltIssuance stops new issuance for an active asset.
  rpc HaltIssuance(MsgHaltIssuance) returns (MsgHaltIssuanceResponse) {}
  // ResumeIssuance returns an issuance-halted asset to active status.
  rpc ResumeIssuance(MsgResumeIssuance) returns (MsgResumeIssuanceResponse) {}
  // SuspendAsset stops unsafe ordinary economic operations. It is a pure
  // status move: the asset's feed keeps running and keeps serving every reader
  // that is not this asset's economics.
  rpc SuspendAsset(MsgSuspendAsset) returns (MsgSuspendAssetResponse) {}
  // OpenSettlement establishes a one-way asset-to-NOAH redemption plan.
  rpc OpenSettlement(MsgOpenSettlement) returns (MsgOpenSettlementResponse) {}
  // CancelSettlement cancels a settlement that has not yet activated.
  rpc CancelSettlement(MsgCancelSettlement) returns (MsgCancelSettlementResponse) {}
  // RecoverAsset restores a suspended or written-off asset to issuance-halted
  // status, undoing SuspendAsset.
  rpc RecoverAsset(MsgRecoverAsset) returns (MsgRecoverAssetResponse) {}
  // WriteOffAsset derecognises outstanding supply without changing balances.
  rpc WriteOffAsset(MsgWriteOffAsset) returns (MsgWriteOffAssetResponse) {}
  // FinaliseRetirement retires an asset within its approved residual bound.
  // Retirement is terminal: there is no RPC back out of it.
  rpc FinaliseRetirement(MsgFinaliseRetirement) returns (MsgFinaliseRetirementResponse) {}
  // SetEmergencyMandate replaces or disables the emergency committee mandate.
  rpc SetEmergencyMandate(MsgSetEmergencyMandate) returns (MsgSetEmergencyMandateResponse) {}
  // EmergencySuspendAsset applies suspension under a live mandate. It changes asset status only,
  // leaving the feed and protocol reference pricing intact.
  rpc EmergencySuspendAsset(MsgEmergencySuspendAsset) returns (MsgEmergencySuspendAssetResponse) {}
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // params defines the x/asset parameters to update. All parameters must be
  // supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegisterAsset registers a new governance-managed Bank asset and admits it
// to normal policy use in the same act. The denomination is the whole
// registration input: Bank metadata is derived from it, so there is nothing
// else for a proposal to state and nothing that a later message could correct.
message MsgRegisterAsset {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgRegisterAsset";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
}

// MsgRegisterAssetResponse is the response type for MsgRegisterAsset.
message MsgRegisterAssetResponse {}

// MsgHaltIssuance immediately stops new issuance for an active asset while
// preserving pricing, liability accounting, transfers, and redemption.
message MsgHaltIssuance {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgHaltIssuance";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgHaltIssuanceResponse is the response type for MsgHaltIssuance.
message MsgHaltIssuanceResponse {}

// MsgResumeIssuance returns an issuance-halted asset to active status without
// changing Oracle, Market, or Treasury policy.
message MsgResumeIssuance {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgResumeIssuance";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgResumeIssuanceResponse is the response type for MsgResumeIssuance.
message MsgResumeIssuanceResponse {}

// MsgSuspendAsset immediately stops unsafe ordinary economic operations for an
// active or issuance-halted asset. Balances, transfers, and the asset's feed
// are all untouched: containment is the status gate each consumer applies, not
// the absence of a rate.
message MsgSuspendAsset {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgSuspendAsset";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgSuspendAssetResponse is the response type for MsgSuspendAsset.
message MsgSuspendAssetResponse {}

// MsgOpenSettlement creates a one-way asset-to-NOAH redemption plan.
message MsgOpenSettlement {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgOpenSettlement";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
  // redemption_rate is the positive number of NOAH paid per one unit of the
  // settled asset, the same orientation as oracle exchange rates.
  string redemption_rate = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // earliest_closing_height must follow the derived activation height and commits to a redemption
  // window. WriteOffAsset is refused before this height.
  int64 earliest_closing_height = 5 [(amino.dont_omitempty) = true];
}

// MsgOpenSettlementResponse is the response type for MsgOpenSettlement.
message MsgOpenSettlementResponse {}

// MsgCancelSettlement cancels a settlement plan before it activates, leaving
// the asset suspended. From activation onward the plan is a hard commitment:
// only RecoverAsset, FinaliseRetirement, or a WriteOffAsset past the announced
// closing height may end it.
message MsgCancelSettlement {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgCancelSettlement";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgCancelSettlementResponse is the response type for MsgCancelSettlement.
message MsgCancelSettlementResponse {}

// MsgRecoverAsset restores a suspended or written-off asset to issuance-halted
// status in the block it executes. The asset's feed must already be active and
// the asset must carry no settlement plan.
message MsgRecoverAsset {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgRecoverAsset";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgRecoverAssetResponse is the response type for MsgRecoverAsset.
message MsgRecoverAssetResponse {}

// MsgWriteOffAsset derecognises outstanding SUSPENDED supply without burning,
// transferring, or repricing holder balances. It is refused before a settlement
// plan's earliest closing height: the announced window is the one guarantee
// holders get, and derecognition is the only act that could break it.
message MsgWriteOffAsset {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgWriteOffAsset";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
}

// MsgWriteOffAssetResponse is the response type for MsgWriteOffAsset.
message MsgWriteOffAssetResponse {}

// MsgFinaliseRetirement permanently retires an asset within its status-specific residual bound and
// closes any settlement. Registry and Bank metadata remain, preventing denomination reuse.
// Retirement does not remove the feed.
message MsgFinaliseRetirement {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgFinaliseRetirement";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_version = 3 [(amino.dont_omitempty) = true];
  // max_residual_supply bounds derecognition from ISSUANCE_HALTED; a positive actual residual
  // creates a RETIREMENT_RESIDUAL record. Other statuses require a zero bound. Positive SUSPENDED
  // supply requires WriteOffAsset.
  string max_residual_supply = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgFinaliseRetirementResponse is the response type for
// MsgFinaliseRetirement.
message MsgFinaliseRetirementResponse {}

// MsgSetEmergencyMandate replaces or disables the emergency committee
// appointment. Every replacement advances the term and clears recorded per-term
// action usage. An empty committee disables the mandate while retaining the
// latest term.
message MsgSetEmergencyMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/asset/MsgSetEmergencyMandate";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // committee is the exact threshold-multisig account, empty to disable.
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
}

// MsgSetEmergencyMandateResponse is the response type for
// MsgSetEmergencyMandate.
message MsgSetEmergencyMandateResponse {}

// MsgEmergencySuspendAsset suspends under the exact live mandate term, with ordinary status
// preconditions and per-term usage limits. The term guards staleness; suspension leaves the feed
// running.
message MsgEmergencySuspendAsset {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/asset/MsgEmergencySuspendAsset";

  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  uint64 expected_term = 3 [(amino.dont_omitempty) = true];
}

// MsgEmergencySuspendAssetResponse is the response type for
// MsgEmergencySuspendAsset.
message MsgEmergencySuspendAssetResponse {}
