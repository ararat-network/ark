syntax = "proto3";
package ark.asset.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos/bank/v1beta1/bank.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/asset/types";

// AssetStatus identifies an asset's economic treatment. Oracle target
// transitions and settlement-plan presence are represented separately.
enum AssetStatus {
  // ASSET_STATUS_UNSPECIFIED is not a valid persisted status.
  ASSET_STATUS_UNSPECIFIED = 0;
  // ASSET_STATUS_ACTIVE identifies an asset available for normal policy use.
  ASSET_STATUS_ACTIVE = 1;
  // ASSET_STATUS_ISSUANCE_HALTED stops new issuance while existing supply remains priced,
  // transferable, and redeemable. Both wind-down and recovered assets use this status.
  ASSET_STATUS_ISSUANCE_HALTED = 2;
  // ASSET_STATUS_SUSPENDED identifies an asset whose ordinary protocol
  // economic operations are disabled without erasing holder balances or
  // recognised exposure.
  ASSET_STATUS_SUSPENDED = 3;
  // ASSET_STATUS_WRITTEN_OFF identifies outstanding supply for which
  // governance currently recognises no protocol redemption obligation.
  ASSET_STATUS_WRITTEN_OFF = 4;
  // ASSET_STATUS_RETIRED identifies a zero-supply asset retained as a
  // historical tombstone.
  ASSET_STATUS_RETIRED = 5;
}

// PriceSource identifies the authority a priced denomination rests on.
enum PriceSource {
  // PRICE_SOURCE_UNSPECIFIED accompanies every unpriced verdict; read reason
  // for why nothing stands behind the denomination. It is deliberately not a
  // valid authority, so a verdict that names no source cannot be mistaken for
  // one that does.
  PRICE_SOURCE_UNSPECIFIED = 0;
  // PRICE_SOURCE_NUMERAIRE is NOAH itself: one by definition rather than by
  // observation.
  PRICE_SOURCE_NUMERAIRE = 1;
  // PRICE_SOURCE_ORACLE is a fresh Oracle rate for a priced-live asset — NOAH
  // per one asset unit, the same value ark.oracle.v1 Query/ExchangeRate
  // returns.
  PRICE_SOURCE_ORACLE = 2;
  // PRICE_SOURCE_SETTLEMENT is the redemption rate of a settlement plan: a
  // standing governance commitment, not an observation that can go stale, and
  // not a market quote.
  PRICE_SOURCE_SETTLEMENT = 3;
}

// UnpricedReason identifies why no rate stands behind a denomination.
enum UnpricedReason {
  // UNPRICED_REASON_UNSPECIFIED accompanies every priced verdict; read source
  // for the authority behind the rate.
  UNPRICED_REASON_UNSPECIFIED = 0;
  // UNPRICED_REASON_FEED_UNAVAILABLE is a priced-live asset the Oracle cannot
  // currently price: its feed is stale, or no rate is stored. last_rate
  // carries what was last observed, when anything ever was.
  UNPRICED_REASON_FEED_UNAVAILABLE = 1;
  // UNPRICED_REASON_UNTRUSTED is suspended supply with no settlement plan: the
  // market rate is exactly what stopped being trustworthy, and governance has
  // not committed to another.
  UNPRICED_REASON_UNTRUSTED = 2;
  // UNPRICED_REASON_WRITTEN_OFF is supply carrying no recognised redemption
  // obligation.
  UNPRICED_REASON_WRITTEN_OFF = 3;
  // UNPRICED_REASON_RETIRED is residual supply of a retired asset.
  UNPRICED_REASON_RETIRED = 4;
  // UNPRICED_REASON_UNRECOGNISED is a denomination outside the registry, or a
  // status this fold does not understand.
  UNPRICED_REASON_UNRECOGNISED = 5;
}

// ResolutionKind identifies why governance derecognised outstanding supply.
enum ResolutionKind {
  // RESOLUTION_KIND_UNSPECIFIED is not a valid persisted resolution kind.
  RESOLUTION_KIND_UNSPECIFIED = 0;
  // RESOLUTION_KIND_WRITE_OFF records emergency derecognition of all
  // recognised obligation on a suspended asset.
  RESOLUTION_KIND_WRITE_OFF = 1;
  // RESOLUTION_KIND_RETIREMENT_RESIDUAL records derecognition of bounded
  // residual supply at final retirement.
  RESOLUTION_KIND_RETIREMENT_RESIDUAL = 2;
}

// Params defines the parameters for the asset module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/asset/Params";

  // settlement_activation_delay_blocks is the correction window between plan opening and
  // activation. Governance can cancel only before activation; the delay must allow time for a
  // correcting proposal. Existing plans retain their stored activation height.
  uint64 settlement_activation_delay_blocks = 1 [(amino.dont_omitempty) = true];
}

// Asset is the authoritative registry record for one governance-managed Bank
// denomination.
message Asset {
  // denom is the immutable Bank base denomination and asset identifier.
  string denom = 1;
  // metadata defines the asset's canonical Bank denomination units.
  cosmos.bank.v1beta1.Metadata metadata = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // status is the asset's current lifecycle status.
  AssetStatus status = 3 [(amino.dont_omitempty) = true];
  // version increases on every lifecycle or pricing-mode mutation.
  uint64 version = 4 [(amino.dont_omitempty) = true];
}

// SettlementPlan defines a governance-approved one-way asset-to-NOAH
// redemption rate.
message SettlementPlan {
  // denom identifies the asset accepted for settlement.
  string denom = 1;
  // redemption_rate is the positive number of NOAH paid per one unit of the
  // settled asset, the same orientation as oracle exchange rates.
  string redemption_rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // activation_height is the opening height plus SettlementActivationDelayBlocks. It is stored so
  // later parameter changes cannot alter the plan's terms.
  int64 activation_height = 3 [(amino.dont_omitempty) = true];
  // earliest_closing_height is the mandatory, immutable holder redemption deadline. WriteOffAsset
  // is refused before it; reaching it does not close settlement automatically.
  int64 earliest_closing_height = 4 [(amino.dont_omitempty) = true];
  // opened_height records the block height at which governance stored these
  // terms.
  int64 opened_height = 5 [(amino.dont_omitempty) = true];
}

// PricedAsset pairs a pricing verdict with its registry record, if any. Exactly one of source and
// reason is set. NOAH and unregistered denominations have no record; external pricing authorities
// supply their own verdicts. See x/asset/README.md, "Consumer pricing views".
message PricedAsset {
  Asset asset = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // rate is unset unless the denomination is priced. Read source before acting
  // on it: a settlement rate is a standing governance commitment, not a market
  // quote, and the two must not be conflated.
  string rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec"
  ];
  // last_rate is the last observed rate for an unavailable feed and is otherwise unset. It supports
  // aggregates over outstanding obligations only; the verdict remains unpriced and cannot support
  // quotes, minting, or payment.
  string last_rate = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec"
  ];
  PriceSource source = 4 [(amino.dont_omitempty) = true];
  UnpricedReason reason = 5 [(amino.dont_omitempty) = true];
}

// ResolutionRecord is an immutable snapshot appended whenever governance
// derecognises outstanding asset supply. A later recovery never erases or
// reinterprets an earlier record.
message ResolutionRecord {
  string denom = 1;
  // version is the advanced asset version at governance derecognition. Records are unique by
  // (denom, version); duplicate appends are rejected.
  uint64 version = 2 [(amino.dont_omitempty) = true];
  // resolution_height is the block height at which the record was appended.
  int64 resolution_height = 3 [(amino.dont_omitempty) = true];
  cosmos.base.v1beta1.Coin outstanding_supply = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // settlement_plan carries final terms only for a write-off that ended an
  // open settlement.
  SettlementPlan settlement_plan = 5;
  // kind identifies why the obligation was derecognised.
  ResolutionKind kind = 6 [(amino.dont_omitempty) = true];
}

// EmergencyMandate appoints a committee whose sole power is asset suspension. It carries the shared
// appointment envelope; per-term suspension usage is separate state keyed by denomination.
message EmergencyMandate {
  // envelope carries the shared term, committee, and half-open height window.
  ark.mandate.v1.Envelope envelope = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
