syntax = "proto3";
package ark.asset.v1;

import "amino/amino.proto";
import "ark/asset/v1/asset.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/asset/types";

// EventAssetRegistered is emitted after a new asset is registered.
message EventAssetRegistered {
  Asset asset = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// EventAssetStatusChanged is emitted after an asset lifecycle transition.
message EventAssetStatusChanged {
  string denom = 1;
  AssetStatus old_status = 2 [ (amino.dont_omitempty) = true ];
  AssetStatus new_status = 3 [ (amino.dont_omitempty) = true ];
  uint64 version = 4 [ (amino.dont_omitempty) = true ];
}

// The EventRegistrationAmended event was removed with the amendment it
// reported; its name stays burned.

// The EventOracleTargetTransitionScheduled and EventOracleTargetsActivated
// events moved to ark.oracle.v1 with the feed registry; their names stay
// burned here.

// EventSettlementOpened is emitted when governance stores settlement terms.
message EventSettlementOpened {
  SettlementPlan settlement_plan = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// EventSettlementCancelled is emitted when governance cancels a settlement
// before activation.
message EventSettlementCancelled {
  string denom = 1;
  uint64 version = 2 [ (amino.dont_omitempty) = true ];
}

// EventSettlementClosed is emitted when an activated settlement ends, carrying
// the plan's full terms and both its open and close heights.
message EventSettlementClosed {
  SettlementPlan settlement_plan = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  uint64 version = 2 [ (amino.dont_omitempty) = true ];
  int64 closed_height = 3 [ (amino.dont_omitempty) = true ];
}

// EventAssetResolved is emitted after a resolution record is appended.
message EventAssetResolved {
  ResolutionRecord resolution_record = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// EventEmergencyMandateSet is emitted after governance replaces or disables
// the emergency committee appointment.
message EventEmergencyMandateSet {
  uint64 term = 1 [ (amino.dont_omitempty) = true ];
  // committee is empty when governance disabled the mandate.
  string committee = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 activation_height = 3 [ (amino.dont_omitempty) = true ];
  uint64 expiry_height = 4 [ (amino.dont_omitempty) = true ];
}

// EventEmergencySuspended is emitted after the committee spends an asset's
// per-term action on a suspension.
message EventEmergencySuspended {
  string denom = 1;
  // term is the mandate term the suspension was executed under.
  uint64 term = 2 [ (amino.dont_omitempty) = true ];
  // version is the asset version produced by the suspension.
  uint64 version = 3 [ (amino.dont_omitempty) = true ];
}

// EventEmergencyHalted is emitted after the committee spends an asset's
// per-term action on an issuance halt. The status the halt lands in is shared
// with wind-downs and recoveries and therefore says nothing about intent; this
// event is where a committee halt is distinguishable from either.
message EventEmergencyHalted {
  string denom = 1;
  // term is the mandate term the halt was executed under.
  uint64 term = 2 [ (amino.dont_omitempty) = true ];
  // version is the asset version produced by the halt.
  uint64 version = 3 [ (amino.dont_omitempty) = true ];
}

// EventReferenceUpdated moved to ark.oracle.v1 with the protocol reference
// itself, where it is EventReferenceDenomUpdated; its name stays burned here.
