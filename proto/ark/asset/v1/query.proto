syntax = "proto3";
package ark.asset.v1;

import "amino/amino.proto";
import "ark/asset/v1/asset.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/query/v1/query.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/ararat-network/ark/x/asset/types";

// Query defines the gRPC querier service.
service Query {
  // Params returns the asset module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/params";
  }

  // Asset returns one registered asset.
  rpc Asset(QueryAssetRequest) returns (QueryAssetResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/assets/{denom}";
  }

  // Assets returns every registered asset. The registry is governance-bounded,
  // so it is returned whole rather than paged.
  rpc Assets(QueryAssetsRequest) returns (QueryAssetsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/assets";
  }

  // SettlementPlan returns the active settlement plan for one asset.
  rpc SettlementPlan(QuerySettlementPlanRequest) returns (QuerySettlementPlanResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/assets/{denom}/settlement";
  }

  // ResolutionHistory returns append-only resolution records for one asset.
  rpc ResolutionHistory(QueryResolutionHistoryRequest) returns (QueryResolutionHistoryResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/assets/{denom}/resolutions";
  }

  // EmergencyMandate returns the committee appointment, its current effective
  // status, and the actions already consumed under its term.
  rpc EmergencyMandate(QueryEmergencyMandateRequest) returns (QueryEmergencyMandateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/asset/v1/emergency_mandate";
  }
}

// QueryParamsRequest is the request type for Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for Query/Params.
message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryAssetRequest is the request type for Query/Asset.
message QueryAssetRequest {
  string denom = 1;
}

// QueryAssetResponse is the response type for Query/Asset.
message QueryAssetResponse {
  PricedAsset priced_asset = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryAssetsRequest is the request type for Query/Assets.
message QueryAssetsRequest {}

// QueryAssetsResponse is the response type for Query/Assets.
message QueryAssetsResponse {
  repeated PricedAsset priced_assets = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QuerySettlementPlanRequest is the request type for Query/SettlementPlan.
message QuerySettlementPlanRequest {
  string denom = 1;
}

// QuerySettlementPlanResponse returns one active settlement plan.
message QuerySettlementPlanResponse {
  SettlementPlan settlement_plan = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryResolutionHistoryRequest is the request type for
// Query/ResolutionHistory.
message QueryResolutionHistoryRequest {
  string denom = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryResolutionHistoryResponse returns append-only resolution records
// ordered by increasing asset version.
message QueryResolutionHistoryResponse {
  repeated ResolutionRecord resolution_records = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryEmergencyMandateRequest is the request type for Query/EmergencyMandate.
message QueryEmergencyMandateRequest {}

// QueryEmergencyMandateResponse returns the committee appointment and its
// current effective status.
message QueryEmergencyMandateResponse {
  EmergencyMandate mandate = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // active reports whether the committee may act at the current height.
  bool active = 2 [(amino.dont_omitempty) = true];
  // suspended_denoms lists the assets whose per-term suspension the committee
  // has already consumed under the current term, sorted.
  repeated string suspended_denoms = 3 [(amino.dont_omitempty) = true];
}
