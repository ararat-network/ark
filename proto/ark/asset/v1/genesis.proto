syntax = "proto3";
package ark.asset.v1;

import "amino/amino.proto";
import "ark/asset/v1/asset.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/asset/types";

// GenesisState defines the asset module's genesis state. The protocol
// reference moved to ark.oracle.v1's genesis with the reference itself.
message GenesisState {
  // params carries the governance-owned module parameters.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated Asset assets = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated SettlementPlan settlement_plans = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated ResolutionRecord resolution_records = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // emergency_mandate seeds the committee appointment or its canonical
  // disabled state.
  EmergencyMandate emergency_mandate = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // emergency_actions lists the assets whose per-term committee action is
  // already spent under the seeded mandate term, sorted and unique. One entry
  // covers both powers: a halt and a suspension draw on the same budget, so
  // which one was spent is history the event log carries, not state.
  repeated string emergency_actions = 6 [ (amino.dont_omitempty) = true ];
}
