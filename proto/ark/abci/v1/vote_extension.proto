syntax = "proto3";
package ark.abci.v1;

option go_package = "github.com/ararat-network/ark/abci/voteextension/types";

// OracleVoteExtension defines the vote extension structure for oracle prices.
message OracleVoteExtension {
  // rates maps denoms to NOAH-per-unit prices, encoded as minimal big-endian
  // positive integers scaled by 10^18, without leading zero bytes.
  // Unpriced denoms are omitted; omission is the only abstention.
  map<string, bytes> rates = 1;
  // target_version identifies the on-chain vote-target epoch used to build
  // this report.
  uint64 target_version = 2;
}
