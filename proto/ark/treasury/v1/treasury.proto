syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/treasury/types";

// Params defines the parameters for the treasury module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/x/treasury/Params";

  // reference_tax_cap is the governance-owned cap used to derive the complete
  // per-denomination tax-cap map. A zero amount means taxation is uncapped; a
  // positive amount derives positive per-denomination ceilings.
  cosmos.base.v1beta1.Coin reference_tax_cap = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // reward_funding_window initializes each new funding countdown.
  uint64 reward_funding_window = 2 [ (amino.dont_omitempty) = true ];
  // tax_cap_refresh_period_blocks is how often the derived per-denomination
  // caps are trued up against rate drift. Membership changes refresh the map on
  // their own, so this cadence exists only for the drift between them: the
  // reference cap is a fixed amount in the reference unit, and every other
  // denomination's ceiling is that amount priced through a rate that keeps
  // moving after the map is built. A shorter period tracks the ceiling
  // governance voted for more closely and rebuilds the map more often; a longer
  // one lets the real ceiling drift further from it.
  uint64 tax_cap_refresh_period_blocks = 3 [ (amino.dont_omitempty) = true ];
}

// MonetaryPolicy is the complete set of reversible Treasury levers delegated
// to the monetary-policy committee.
message MonetaryPolicy {
  string stability_tax_rate = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_block_reward_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_block_reward_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string redemption_buffer_target_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string strategic_reserve_target_ratio = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string insurance_target_ratio = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MonetaryMandate stores one governance-created, bounded committee
// appointment. An empty committee identifies a disabled mandate; term still
// increases on replacement so previously prepared committee transactions
// cannot become valid again.
message MonetaryMandate {
  // envelope carries the shared term, committee, and half-open height window.
  ark.mandate.v1.Envelope envelope = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  MonetaryPolicy minimum_policy = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  MonetaryPolicy maximum_policy = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// RewardFundingState stores aggregate reward-funding accounting for the
// current Treasury settlement window.
message RewardFundingState {
  // blocks_remaining is the number of observations before settlement.
  uint64 blocks_remaining = 1 [ (amino.dont_omitempty) = true ];
  string validator_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_fee_value = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// TaxCap defines the tax ceiling for one denomination. A zero amount is the
// explicit uncapped sentinel; a missing entry is a configuration error.
message TaxCap {
  string denom = 1;
  // tax_cap is zero for uncapped taxation or positive for a finite ceiling.
  string tax_cap = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// WrittenOffExposure discloses supply governance has formally derecognized.
// The coin carries the denomination; the version pins which asset record the
// write-off resolved.
message WrittenOffExposure {
  cosmos.base.v1beta1.Coin outstanding_supply = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  uint64 write_off_version = 2;
}
