syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// Params defines the parameters for the treasury module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/treasury/Params";

  // reference_denom is the unit every reference-quoted Treasury figure is
  // stated in. Identity with the protocol reference is enforced at genesis
  // and frozen against MsgUpdateParams; only a reference re-point moves it.
  string reference_denom = 1;
  // reference_tax_cap derives the complete per-denomination tax-cap map, in
  // reference_denom base units. Zero means taxation is uncapped; a positive
  // amount derives positive per-denomination ceilings.
  string reference_tax_cap = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // reward_funding_window initialises each new funding countdown.
  uint64 reward_funding_window = 3 [(amino.dont_omitempty) = true];

  // Exposure sampling cadence, decay, cap, and step limits are governance parameters; indicator
  // weights belong to EconomicPolicy. Domain validation bounds block-hook arithmetic and constrains
  // delegated policy. See x/treasury/README.md.

  // volatility_decay is the per-block EWMA retention for the variance
  // series, in [0, 1). A value at or above one would never forget a sample.
  string volatility_decay = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_decay is the per-block EMA retention for the flow series, in
  // [0, 1).
  string flow_decay = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // multiplier_cap is the ceiling on the applied multiplier, at least
  // one. It is also the saturation point: a composite that leaves representable
  // range resolves here rather than failing a block, because stress past
  // measurement is the cap by definition.
  string multiplier_cap = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // multiplier_max_step is the most the multiplier may move in one
  // update, in either direction. Positive: a zero step would freeze the
  // multiplier at its stored value forever.
  string multiplier_max_step = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // exposure_refresh_period_blocks is how often the multiplier is recomputed
  // from the sampled series. Sampling itself is per block; only the
  // recomputation waits. It keeps the exposure qualifier the four fields above
  // drop so the cadence reads as the multiplier's rather than the module's.
  uint64 exposure_refresh_period_blocks = 8 [(amino.dont_omitempty) = true];

  // The base-fee controller's rails (dynamic fees, phase 2a). The live price
  // is state the controller rewrites every block, not a parameter; these
  // three bound where it rests and how fast it moves.

  // base_fee_target_utilisation is the block-gas utilisation the controller
  // holds price at, in (0, 1]. Above it the price rises, below it decays.
  string base_fee_target_utilisation = 9 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // base_fee_adjustment_rate is the largest proportional base-fee move per
  // block, in [0, 1]. Zero disables the controller and holds the price at
  // min_base_gas_price.
  string base_fee_adjustment_rate = 10 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // min_base_gas_price is the controller's floor and resting price, in
  // reference_denom base units per gas unit. Positive: a zero floor would
  // let sustained empty blocks decay gas to free.
  string min_base_gas_price = 11 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // transfer_tax_rate is the governance-set taxable transfer share in [0, 1]; zero disables tax
  // without clearing factors. It cannot exceed the reachable conversion spread floor, preventing
  // untaxed NOAH routing from bypassing a higher transfer charge.
  string transfer_tax_rate = 12 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// ExposureState is the running risk estimate behind the multiplier: two
// per-block series, the inputs of the last applied update, and the multiplier
// every target consumer reads.
message ExposureState {
  // last_reference_price is the previous block's protocol reference rate — NOAH
  // per one reference unit — held to form the next return. It is a price, so a
  // reference move re-expresses it by the reciprocal of a quantity's factor. Zero means no sample has been taken yet, so the
  // next one records a price and produces no return.
  string last_reference_price = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // volatility_variance is the EWMA of squared per-block returns. Each sample
  // is clamped to [-1, 1], which bounds this series to [0, 1] by induction and
  // so bounds annualised volatility by the square root of a year in blocks.
  string volatility_variance = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_pressure is the EMA of per-block net redemption value in NOAH. It is
  // an absolute quantity, divided by net liability only when the multiplier is
  // applied, so a changing liability never restates the stored series.
  string flow_pressure = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // liability_ratio is the ratio behind the last applied update, kept so the
  // multiplier's inputs are readable without recomputing the fold.
  string liability_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // multiplier is what target consumers currently scale by, at least one.
  string multiplier = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_ratio stores the last refresh's flow pressure divided by its net liability basis. It is
  // zero for a non-positive basis and remains separate from continuously changing samples.
  string flow_ratio = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // last_refresh_height identifies the block that produced liability_ratio, flow_ratio, and
  // multiplier. Zero means no refresh. Continuation exports preserve this absolute height.
  uint64 last_refresh_height = 7 [(amino.dont_omitempty) = true];
}

// EconomicPolicy is the complete set of reversible Treasury levers delegated
// to the economic-policy committee.
message EconomicPolicy {
  string validator_block_reward_target = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_block_reward_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string redemption_buffer_target_ratio = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string strategic_reserve_target_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string insurance_target_ratio = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // Exposure weights set extra capital demand per risk indicator. Params owns the sampling
  // instrument and movement bounds. Zero launch weights keep the multiplier at one; disabled
  // indicators cease contributing to the target.

  // liability_ratio_weight scales net liability over circulating NOAH: the
  // dilution term, and the one indicator that states directly how reflexive a
  // redemption is.
  string liability_ratio_weight = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // volatility_weight scales annualised realised volatility of the protocol
  // reference rate.
  string volatility_weight = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_weight scales redemption flow pressure as a share of net liability.
  string flow_weight = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EconomicMandate stores one governance-created, bounded committee
// appointment. An empty committee identifies a disabled mandate; term still
// increases on replacement so previously prepared committee transactions
// cannot become valid again.
message EconomicMandate {
  // envelope carries the shared term, committee, and half-open height window.
  ark.mandate.v1.Envelope envelope = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EconomicPolicy minimum_policy = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EconomicPolicy maximum_policy = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// RewardFundingState stores aggregate reward-funding accounting for the
// current Treasury settlement window.
message RewardFundingState {
  // blocks_remaining is the number of observations before settlement.
  uint64 blocks_remaining = 1 [(amino.dont_omitempty) = true];
  string validator_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_fee_value = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// TaxCap defines the tax ceiling for one denomination. A zero amount is the
// explicit uncapped sentinel; a missing entry is a configuration error.
message TaxCap {
  string denom = 1;
  // tax_cap is zero for uncapped taxation or positive for a finite ceiling.
  string tax_cap = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// ConversionFactor stores denomination units per reference unit. Fresh observations refresh it;
// unavailable rates retain its last value. Tax caps derive as reference_tax_cap * factor for
// eligible members; NOAH factors support gas pricing but never taxation.
message ConversionFactor {
  string denom = 1;
  // factor is strictly positive: an underivable arrival is seeded at one,
  // never zero.
  string factor = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // derived_height is the block whose rates produced the factor, kept for
  // observability and future staleness policy; the reads ignore it.
  uint64 derived_height = 3 [(amino.dont_omitempty) = true];
}

// GasPrice is one row of the fee-denomination price sheet.
message GasPrice {
  string denom = 1;
  // gas_price is denom base units per gas unit: the base price carried
  // through the denomination's conversion factor.
  string gas_price = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // derived_height is the block whose rates derived the denomination's
  // conversion factor, so staleness is observable. Zero for the reference
  // denomination: its cross is identity and cannot go stale.
  uint64 derived_height = 3 [(amino.dont_omitempty) = true];
}

// WrittenOffExposure discloses supply governance has formally derecognised.
// The coin carries the denomination; the version pins which asset record the
// write-off resolved.
message WrittenOffExposure {
  cosmos.base.v1beta1.Coin outstanding_supply = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 write_off_version = 2;
}
