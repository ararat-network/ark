syntax = "proto3";
// SPDX-License-Identifier: Apache-2.0
// Originates from Ark's Terra Classic port of proto/terra/treasury/v1beta1/genesis.proto.
// Modified for Ark: treasury schema and modern SDK integration.
// See NOTICE and THIRD_PARTY_NOTICES.md for upstream attribution.
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// GenesisState defines the treasury module's genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // conversion_factors may carry the numeraire's cross beside the members';
  // the tax base excludes NOAH by denomination, never by table absence.
  repeated ConversionFactor conversion_factors = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  RewardFundingState reward_funding = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EconomicMandate economic_mandate = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EconomicPolicy economic_policy = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // exposure_state carries the multiplier and the two sampled series across an
  // export. The series are the only history behind the multiplier, so dropping
  // them would restart every EWMA from zero and hand the new chain a
  // calm-market multiplier during whatever conditions prompted the export.
  ExposureState exposure_state = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // exposure_refresh_pending records a refresh period that elapsed without a
  // successful recomputation, on the same terms as tax_cap_refresh_pending: the
  // boundary is an instant rather than a state, so an owed refresh survives
  // export instead of being forgiven by the migration.
  bool exposure_refresh_pending = 7 [(amino.dont_omitempty) = true];
  // base_gas_price is the base-fee controller's live price, in reference_denom
  // base units per gas unit. At least min_base_gas_price: a fresh chain starts
  // at the floor, and an export carries whatever the controller had reached.
  string base_gas_price = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
