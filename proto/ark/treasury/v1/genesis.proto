syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/treasury/v1/treasury.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/treasury/types";

// GenesisState defines the treasury module's genesis state.
message GenesisState {
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  repeated TaxCap tax_caps = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  RewardFundingState reward_funding = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  MonetaryMandate monetary_mandate = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  MonetaryPolicy monetary_policy = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // tax_cap_refresh_pending records a cadence boundary that passed without a
  // successful tax-cap rebuild, so an owed refresh survives export and import
  // instead of being forgiven by the migration.
  bool tax_cap_refresh_pending = 6 [ (amino.dont_omitempty) = true ];
}
