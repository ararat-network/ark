syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// EventConversionFactorsRefreshed reports the factors a write pass changed —
// the per-block refresh, or the reference re-point's rescale. It carries
// changed values only, unlike its per-pass predecessor: the refresh runs
// every block, so a re-derivation to the held value is the steady state and
// reporting it would be constant noise.
message EventConversionFactorsRefreshed {
  repeated ConversionFactor conversion_factors = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventBlockRewardsToppedUp is emitted after a reward-funding window settles.
message EventBlockRewardsToppedUp {
  string denom = 1;
  string validator_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_organic = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_organic = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_paid = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_paid = 7 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventUnpricedStabilityTaxRouted reports settlement routing of stability tax
// held in denominations without a usable Oracle rate. Moved supply belongs to
// written-off or retired assets and now sits in the strategic reserve;
// deferred supply stays in the collector awaiting a returning feed.
message EventUnpricedStabilityTaxRouted {
  repeated cosmos.base.v1beta1.Coin moved = 1 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated cosmos.base.v1beta1.Coin deferred = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventLiabilityIncomplete discloses a liability valuation that could not
// cover every recognised liability, and is emitted only in that degraded
// state. At least one of the two supply lists below is non-empty and is the
// reason. Conversion settlement emits it once for the block's own valuation,
// and a committee bound sized on the degraded aggregate emits it again inside
// the transaction that acted on it, so a block can carry several.
message EventLiabilityIncomplete {
  // claimable_liability is the aggregate that can currently redeem, in anoah.
  // It is the denominator redemption coverage divides by, and the basis a
  // committee transfer into an underfunded fund is bounded by. What it does
  // not support is sizing a bound on destroying capital, which is withheld
  // entirely while this fires.
  cosmos.base.v1beta1.DecCoin claimable_liability = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // stale_member_supply is supply whose feed was unavailable. It is still
  // counted above at its last known rate: an absent feed is absent evidence,
  // not an extinguished obligation.
  repeated cosmos.base.v1beta1.Coin stale_member_supply = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // untrusted_suspended_supply is SUSPENDED supply with no settlement plan,
  // valuable by no honest rate and so outside the aggregate entirely.
  repeated cosmos.base.v1beta1.Coin untrusted_suspended_supply = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

// EventExpansionAllocated records one block's realised expansion allocation,
// emitted once from conversion settlement in Market's EndBlocker. Every figure
// is an aggregate over the block's expansions: their principal is placed
// together against one liability valuation, so no per-conversion split exists
// to report, and the individual conversions are visible as Market swap events.
//
// Valuation completeness is not carried here. Settlement discloses a degraded
// valuation through EventLiabilityIncomplete before it allocates, so the same
// block already says whether these credits were sized against targets at all.
//
// The spread is deliberately absent. It owes nothing to liability, fund state,
// or valuation completeness, so each conversion burns its own as it charges it
// and never defers; Market's swap event discloses it in the output
// denomination.
message EventExpansionAllocated {
  string denom = 1;
  string redemption_buffer_credit = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string strategic_reserve_credit = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string insurance_credit = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string overflow_burn = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventRedemptionBufferDrawn records one block's redemption-buffer draw,
// emitted once from conversion settlement. payment is the aggregate the Buffer
// funded across every redemption in the block, sized by one coverage ratio; it
// is paid to Market and burned there against output already minted, rather
// than paid to any trader.
message EventRedemptionBufferDrawn {
  string denom = 1;
  string payment = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventExposureRefreshed records one completed refresh of the exposure
// multiplier, with every input behind it. It is emitted per refresh rather than
// per change — a refresh that leaves the multiplier where it was still says the
// indicators were read and what they said — and never per sample, since
// sampling runs every block and would bury the periods that moved the number.
//
// uncapped_multiplier is the composite before the step limit and the cap, so an
// operator can see how hard the guardrails are binding — a multiplier sitting
// at the cap for many periods reads very differently from one that arrived
// there once.
message EventExposureRefreshed {
  string previous_multiplier = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string multiplier = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string uncapped_multiplier = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string liability_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string annualised_volatility = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_ratio is the stored EMA divided by the net liability this update
  // sized against, which is the dimensionless form the composite consumes.
  string flow_ratio = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventMonetaryMandateSet is emitted when governance appoints, replaces, or
// disables the monetary-policy committee. A disabling carries the empty
// committee and the advanced term.
message EventMonetaryMandateSet {
  uint64 term = 1 [(amino.dont_omitempty) = true];
  // committee is empty when governance disabled the mandate.
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
  // committee_shape is the appointment-time observation of the committee
  // account, zeroed on a disabling.
  ark.mandate.v1.CommitteeShape committee_shape = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventReferenceTaxCapRebased records the reference tax cap re-expressed in a
// new protocol reference unit. Emitted only by RebaseReferenceState, whose only caller
// is MsgSetReference.
message EventReferenceTaxCapRebased {
  cosmos.base.v1beta1.Coin old_cap = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin new_cap = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventBaseGasPriceUpdated reports a new base gas price: the controller's
// per-block update, on change only — holding at the floor or the target is
// the steady state and not news — or the reference re-point's re-quote.
message EventBaseGasPriceUpdated {
  // base_gas_price is the new price, in reference-denom base units per gas
  // unit.
  string base_gas_price = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
