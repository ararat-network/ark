syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// EventConversionFactorsRefreshed reports only factors changed by a block refresh or reference
// rebase. Unchanged derivations emit no entries.
message EventConversionFactorsRefreshed {
  repeated ConversionFactor conversion_factors = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventBlockRewardsToppedUp is emitted after a reward-funding window settles.
message EventBlockRewardsToppedUp {
  string denom = 1;
  string validator_target = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_target = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_organic = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_organic = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string validator_paid = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string oracle_paid = 7 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventUnpricedTransferTaxRouted reports settlement routing of transfer tax
// held in denominations without a usable Oracle rate. Moved supply belongs to
// written-off or retired assets and now sits in the strategic reserve;
// deferred supply stays in the collector awaiting a returning feed.
message EventUnpricedTransferTaxRouted {
  repeated cosmos.base.v1beta1.Coin moved = 1 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  repeated cosmos.base.v1beta1.Coin deferred = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

// EventLiabilityIncomplete discloses stale member or untrusted suspended supply. Conversion
// settlement emits it for a degraded valuation; committee actions using degraded bounds may emit
// additional events in the same block.
message EventLiabilityIncomplete {
  // claimable_liability is the valued nominal aggregate in NOAH, before self-held netting. It can
  // bound fund refills, but incomplete valuation cannot authorise capital destruction. Redemption
  // coverage separately uses net liability plus retired value.
  cosmos.base.v1beta1.DecCoin claimable_liability = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // stale_member_supply is supply whose feed was unavailable. It is still
  // counted above at its last known rate: an absent feed is absent evidence,
  // not an extinguished obligation.
  repeated cosmos.base.v1beta1.Coin stale_member_supply = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // untrusted_suspended_supply is SUSPENDED supply with no settlement plan,
  // valuable by no honest rate and so outside the aggregate entirely.
  repeated cosmos.base.v1beta1.Coin untrusted_suspended_supply = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// EventExpansionAllocated reports the block's realised allocation. Credits plus overflow burn equal
// gross expansion offers, including spread and dust. Market swap events describe individual trades;
// EventLiabilityIncomplete separately discloses degraded valuation.
message EventExpansionAllocated {
  string denom = 1;
  string redemption_buffer_credit = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string strategic_reserve_credit = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string insurance_credit = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string overflow_burn = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventRedemptionBufferDrawn reports aggregate block coverage. The Buffer pays Market, which burns
// it against NOAH already minted to traders; no trader receives this transfer directly.
message EventRedemptionBufferDrawn {
  string denom = 1;
  string payment = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventExposureRefreshed reports every completed multiplier refresh, even if unchanged, but not
// individual samples. uncapped_multiplier exposes demand before step and cap limits.
message EventExposureRefreshed {
  string previous_multiplier = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string multiplier = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string uncapped_multiplier = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string liability_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string annualised_volatility = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // flow_ratio is the stored EMA divided by the net liability this update
  // sized against, which is the dimensionless form the composite consumes.
  string flow_ratio = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventEconomicMandateSet is emitted when governance appoints, replaces, or
// disables the economic-policy committee. A disabling carries the empty
// committee and the advanced term.
message EventEconomicMandateSet {
  uint64 term = 1 [(amino.dont_omitempty) = true];
  // committee is empty when governance disabled the mandate.
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
  // committee_shape is the appointment-time observation of the committee
  // account, zeroed on a disabling.
  ark.mandate.v1.CommitteeShape committee_shape = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventReferenceTaxCapRebased records the reference tax cap re-expressed in a
// new protocol reference unit. Emitted only by RebaseReferenceState, whose only caller
// is MsgSetReference.
message EventReferenceTaxCapRebased {
  cosmos.base.v1beta1.Coin old_cap = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin new_cap = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventBaseGasPriceUpdated reports a new base gas price: the controller's
// per-block update, on change only — holding at the floor or the target is
// the steady state and not news — or the reference re-point's re-quote.
message EventBaseGasPriceUpdated {
  // base_gas_price is the new price, in reference-denom base units per gas
  // unit.
  string base_gas_price = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
