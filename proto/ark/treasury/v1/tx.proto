syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/treasury/types";

// Msg defines the treasury module's message service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates governance-owned structural Treasury parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}
  // SetMonetaryMandate appoints, replaces, or disables the bounded
  // monetary-policy committee.
  rpc SetMonetaryMandate(MsgSetMonetaryMandate)
      returns (MsgSetMonetaryMandateResponse) {}
  // UpdateMonetaryPolicy applies one complete reversible policy candidate.
  // The configured committee or governance authority may sign.
  rpc UpdateMonetaryPolicy(MsgUpdateMonetaryPolicy)
      returns (MsgUpdateMonetaryPolicyResponse) {}
  // SetClaimsMandate appoints, replaces, or disables the height-scoped Claims
  // committee and shared cancellation period.
  rpc SetClaimsMandate(MsgSetClaimsMandate)
      returns (MsgSetClaimsMandateResponse) {}
  // SubmitClaim records a committee- or governance-submitted pending claim.
  rpc SubmitClaim(MsgSubmitClaim) returns (MsgSubmitClaimResponse) {}
  // CancelClaim cancels one pending claim during its cancellation period.
  // Governance may cancel any claim; the committee may cancel only a claim not
  // submitted by governance.
  rpc CancelClaim(MsgCancelClaim) returns (MsgCancelClaimResponse) {}
  // ExecuteClaim pays a pending claim after its cancellation period.
  rpc ExecuteClaim(MsgExecuteClaim) returns (MsgExecuteClaimResponse) {}
  // TransferReserveToBuffer commits strategic Reserve NOAH to the Buffer.
  rpc TransferReserveToBuffer(MsgTransferReserveToBuffer)
      returns (MsgTransferReserveToBufferResponse) {}
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/treasury/MsgUpdateParams";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse is the Msg/UpdateParams response type.
message MsgUpdateParamsResponse {}

// MsgSetMonetaryMandate is the governance request for a complete
// monetary-policy committee replacement. An empty committee disables the
// mandate; Treasury derives the next term on chain.
message MsgSetMonetaryMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/treasury/MsgSetMonetaryMandate";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string committee = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 activation_height = 3 [ (amino.dont_omitempty) = true ];
  uint64 expiry_height = 4 [ (amino.dont_omitempty) = true ];
  MonetaryPolicy minimum_policy = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  MonetaryPolicy maximum_policy = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgSetMonetaryMandateResponse is the response for a committee
// appointment, replacement, or disablement.
message MsgSetMonetaryMandateResponse {}

// MsgUpdateMonetaryPolicy is an exact committee- or governance-signed policy
// update. expected_term protects committee transactions from authority
// rotation; governance authorization does not depend on the current term.
message MsgUpdateMonetaryPolicy {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "ark/x/treasury/MsgUpdateMonetaryPolicy";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 expected_term = 2 [ (amino.dont_omitempty) = true ];
  MonetaryPolicy policy = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateMonetaryPolicyResponse is the response for one monetary-policy
// update.
message MsgUpdateMonetaryPolicyResponse {}

// MsgSetClaimsMandate is the request for a complete Claims committee mandate.
// The committee claim limit is a fixed gross unoah allowance for the new term.
message MsgSetClaimsMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/treasury/MsgSetClaimsMandate";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string committee = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 activation_height = 3 [ (amino.dont_omitempty) = true ];
  uint64 expiry_height = 4 [ (amino.dont_omitempty) = true ];
  uint64 cancellation_period_blocks = 5 [ (amino.dont_omitempty) = true ];
  string committee_claim_limit = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgSetClaimsMandateResponse is the response for a Claims committee mandate.
message MsgSetClaimsMandateResponse {}

// MsgSubmitClaim is a committee- or governance-signed exact claim submission.
message MsgSubmitClaim {
  option (cosmos.msg.v1.signer) = "submitter";
  option (amino.name) = "ark/x/treasury/MsgSubmitClaim";

  string submitter = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // expected_term binds both committee and governance submissions to the
  // Claims mandate used to derive their cancellation period.
  uint64 expected_term = 2 [ (amino.dont_omitempty) = true ];
  string incident_reference = 3;
  string recipient = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin amount = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string evidence_reference = 6;
}

// MsgSubmitClaimResponse is the response for a claim submission.
message MsgSubmitClaimResponse {
  uint64 claim_id = 1 [ (amino.dont_omitempty) = true ];
}

// MsgCancelClaim is a committee- or governance-authorized pending claim
// cancellation during the shared cancellation period.
message MsgCancelClaim {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "ark/x/treasury/MsgCancelClaim";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // expected_term protects committee cancellations from stale signatures.
  // Governance cancellation does not depend on the current committee term.
  uint64 expected_term = 2 [ (amino.dont_omitempty) = true ];
  uint64 claim_id = 3 [ (amino.dont_omitempty) = true ];
  string reason = 4;
  string reference = 5;
}

// MsgCancelClaimResponse is the response for claim cancellation.
message MsgCancelClaimResponse {}

// MsgExecuteClaim requests execution of one immutable pending claim.
message MsgExecuteClaim {
  option (cosmos.msg.v1.signer) = "caller";
  option (amino.name) = "ark/x/treasury/MsgExecuteClaim";

  string caller = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 claim_id = 2 [ (amino.dont_omitempty) = true ];
}

// MsgExecuteClaimResponse is the response for claim execution.
message MsgExecuteClaimResponse {}

// MsgTransferReserveToBuffer defines one governance-authorized
// strategic Reserve commitment.
message MsgTransferReserveToBuffer {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/treasury/MsgTransferToBuffer";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin amount = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.v1beta1.Coin minimum_reserve_balance = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgTransferReserveToBufferResponse is the response for a strategic
// Reserve commitment.
message MsgTransferReserveToBufferResponse {}
