syntax = "proto3";
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// Msg defines the treasury module's message service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates governance-owned structural Treasury parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}
  // SetEconomicMandate appoints, replaces, or disables the bounded
  // economic-policy committee.
  rpc SetEconomicMandate(MsgSetEconomicMandate) returns (MsgSetEconomicMandateResponse) {}
  // UpdatePolicy applies one complete reversible policy candidate as
  // the governance authority, unbounded by the committee mandate.
  rpc UpdatePolicy(MsgUpdatePolicy) returns (MsgUpdatePolicyResponse) {}
  // CommitteeUpdatePolicy applies one complete reversible policy
  // candidate as the economic-policy committee, inside its mandate bounds.
  rpc CommitteeUpdatePolicy(MsgCommitteeUpdatePolicy) returns (MsgCommitteeUpdatePolicyResponse) {}

  // ReturnSubsidy moves idle subsidy NOAH into the community pool as the
  // governance authority.
  rpc ReturnSubsidy(MsgReturnSubsidy) returns (MsgReturnSubsidyResponse) {}
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/treasury/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse is the Msg/UpdateParams response type.
message MsgUpdateParamsResponse {}

// MsgSetEconomicMandate is the governance request for a complete
// economic-policy committee replacement. An empty committee disables the
// mandate; Treasury derives the next term on chain.
message MsgSetEconomicMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/treasury/MsgSetEconomicMandate";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
  EconomicPolicy minimum_policy = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EconomicPolicy maximum_policy = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgSetEconomicMandateResponse is the response for a committee
// appointment, replacement, or disablement.
message MsgSetEconomicMandateResponse {}

// MsgUpdatePolicy is a governance-signed policy update. Governance
// applies any structurally valid candidate, so it carries no expected term:
// its authorization never depends on the committee mandate.
message MsgUpdatePolicy {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/treasury/MsgUpdatePolicy";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  EconomicPolicy policy = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdatePolicyResponse is the response for one governance
// economic-policy update.
message MsgUpdatePolicyResponse {}

// MsgCommitteeUpdatePolicy is an exact committee-signed policy update.
// expected_term protects committee transactions from authority rotation, and
// every field must fall inside the mandate's minimum and maximum policies.
message MsgCommitteeUpdatePolicy {
  option (cosmos.msg.v1.signer) = "committee";
  // The protobuf-derived Amino name exceeds the SDK type-name limit, so this
  // message uses the compact identifier below. Its protobuf message name, RPC
  // name, signer, and semantics are unchanged.
  option (amino.name) = "ark/treasury/MsgCommitteeUpdatePolicy";

  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  EconomicPolicy policy = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgCommitteeUpdatePolicyResponse is the response for one committee
// economic-policy update.
message MsgCommitteeUpdatePolicyResponse {}

// MsgReturnSubsidy returns subsidy NOAH to the community pool. Source,
// destination, and denomination are fixed in keeper code; the request
// carries an amount and a per-proposal stale-state guard.
message MsgReturnSubsidy {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/treasury/MsgReturnSubsidy";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // minimum_subsidy_balance is a per-proposal stale-state guard, not a
  // protocol floor: the return fails if it would leave less. Zero permits a
  // full return.
  cosmos.base.v1beta1.Coin minimum_subsidy_balance = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgReturnSubsidyResponse is the response for one subsidy return.
message MsgReturnSubsidyResponse {}
