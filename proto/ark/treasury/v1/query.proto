syntax = "proto3";
// SPDX-License-Identifier: Apache-2.0
// Originates from Ark's Terra Classic port of proto/terra/treasury/v1beta1/query.proto.
// Modified for Ark: treasury schema and modern SDK integration.
// See NOTICE and THIRD_PARTY_NOTICES.md for upstream attribution.
package ark.treasury.v1;

import "amino/amino.proto";
import "ark/treasury/v1/treasury.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/ararat-network/ark/x/treasury/types";

// Query defines the treasury module's gRPC query service.
service Query {
  // Params queries the treasury parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/params";
  }

  // EconomicPolicy queries the current reversible Treasury policy.
  rpc EconomicPolicy(QueryEconomicPolicyRequest) returns (QueryEconomicPolicyResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/economic_policy";
  }

  // EconomicMandate queries the governed committee appointment and its
  // current effective status.
  rpc EconomicMandate(QueryEconomicMandateRequest) returns (QueryEconomicMandateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/economic_mandate";
  }

  // TaxCap queries the derived tax cap for one denomination.
  rpc TaxCap(QueryTaxCapRequest) returns (QueryTaxCapResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/tax_caps/{denom}";
  }

  // TaxCaps queries all derived denomination tax caps.
  rpc TaxCaps(QueryTaxCapsRequest) returns (QueryTaxCapsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/tax_caps";
  }

  // ConversionFactor queries one denomination's stored conversion factor,
  // the reference cross rate the tax cap derives from.
  rpc ConversionFactor(QueryConversionFactorRequest) returns (QueryConversionFactorResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/conversion_factors/{denom}";
  }

  // ConversionFactors queries the complete factor table in denomination
  // order, derivation heights included, so staleness is observable.
  rpc ConversionFactors(QueryConversionFactorsRequest) returns (QueryConversionFactorsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/conversion_factors";
  }

  // GasPrice queries one accepted fee denomination's gas price — the base
  // price carried through its conversion factor. The reference
  // denomination's row is the base price itself, at the identity factor.
  rpc GasPrice(QueryGasPriceRequest) returns (QueryGasPriceResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/gas_prices/{denom}";
  }

  // GasPrices queries the complete fee-denomination price sheet — the posted
  // gas-price list, on chain and consensus.
  rpc GasPrices(QueryGasPricesRequest) returns (QueryGasPricesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/gas_prices";
  }

  // ComputeTax computes the ante-visible transfer tax for SDK messages.
  rpc ComputeTax(QueryComputeTaxRequest) returns (QueryComputeTaxResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http) = {
      post: "/ark/treasury/v1/compute_tax"
      body: "*"
    };
  }

  // FundStatus queries Treasury fund balances, liabilities, and targets.
  rpc FundStatus(QueryFundStatusRequest) returns (QueryFundStatusResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/fund_status";
  }

  // RewardFunding queries the active reward-funding accounting.
  rpc RewardFunding(QueryRewardFundingRequest) returns (QueryRewardFundingResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/reward_funding";
  }

  // ExposureStatus queries the risk state behind the fund-target multiplier.
  rpc ExposureStatus(QueryExposureStatusRequest) returns (QueryExposureStatusResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/treasury/v1/exposure_status";
  }
}

// QueryParamsRequest is the request type for Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for Query/Params.
message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryEconomicPolicyRequest is the request for the current economic policy.
message QueryEconomicPolicyRequest {}

// QueryEconomicPolicyResponse returns the current reversible Treasury policy.
message QueryEconomicPolicyResponse {
  EconomicPolicy policy = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryEconomicMandateRequest is the request for the governed
// economic-policy committee appointment.
message QueryEconomicMandateRequest {}

// QueryEconomicMandateResponse returns the stored mandate and whether it
// is usable at the current height.
message QueryEconomicMandateResponse {
  EconomicMandate mandate = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  bool active = 2 [(amino.dont_omitempty) = true];
}

// QueryTaxCapRequest is the request type for Query/TaxCap.
message QueryTaxCapRequest {
  string denom = 1;
}

// QueryTaxCapResponse is the response type for Query/TaxCap.
message QueryTaxCapResponse {
  // tax_cap is zero when the configured denomination is explicitly uncapped.
  // A missing cap returns an error rather than this sentinel.
  string tax_cap = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryConversionFactorRequest is the request type for Query/ConversionFactor.
message QueryConversionFactorRequest {
  string denom = 1;
}

// QueryConversionFactorResponse is the response type for
// Query/ConversionFactor. A missing factor returns an error: absence is the
// untaxed verdict, not an empty entry.
message QueryConversionFactorResponse {
  ConversionFactor conversion_factor = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryConversionFactorsRequest is the request type for
// Query/ConversionFactors.
message QueryConversionFactorsRequest {}

// QueryConversionFactorsResponse is the response type for
// Query/ConversionFactors.
message QueryConversionFactorsResponse {
  repeated ConversionFactor conversion_factors = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryTaxCapsRequest is the request type for Query/TaxCaps.
message QueryTaxCapsRequest {}

// QueryTaxCapsResponse is the response type for Query/TaxCaps.
message QueryTaxCapsResponse {
  // tax_caps includes explicit zero entries for uncapped denominations.
  repeated TaxCap tax_caps = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryComputeTaxRequest is the request type for Query/ComputeTax.
message QueryComputeTaxRequest {
  repeated google.protobuf.Any messages = 1 [(cosmos_proto.accepts_interface) = "cosmos.base.v1beta1.Msg"];
}

// QueryComputeTaxResponse is the response type for Query/ComputeTax.
message QueryComputeTaxResponse {
  repeated cosmos.base.v1beta1.Coin tax = 1 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // tax_base is the principal the tax was computed over, summed per
  // denomination: what the messages move, as the calculator saw it. The tax
  // is at most rate × tax_base, less where a cap bound an input.
  repeated cosmos.base.v1beta1.Coin tax_base = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

// QueryFundStatusRequest is the request type for Query/FundStatus.
message QueryFundStatusRequest {}

// QueryFundStatusResponse partitions valued liability and excluded supply. Nonempty
// stale_member_supply or untrusted_suspended_supply marks incompleteness and zeroes reported
// targets. Written-off exposure is derecognised and does not affect completeness.
message QueryFundStatusResponse {
  // Liability buckets are NOAH DecCoins; supply disclosures retain native denominations.
  // Priced, settlement, and stale-priced liability sum to nominal_liability.

  // priced_liability values ACTIVE and ISSUANCE_HALTED supply at fresh Oracle
  // rates. It excludes any member listed in stale_member_supply.
  cosmos.base.v1beta1.DecCoin priced_liability = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // settlement_liability values SUSPENDED supply carrying an open settlement
  // plan at the plan's committed rate.
  cosmos.base.v1beta1.DecCoin settlement_liability = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // stale_priced_liability values stale members at their last observed rates, excluding
  // never-priced feeds. It retains outstanding obligations in nominal liability without supporting
  // fresh quotes or complete fund targets.
  cosmos.base.v1beta1.DecCoin stale_priced_liability = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // nominal_liability sums priced, committed, and stale-priced liability before self-held netting.
  // It remains visible when incomplete; exclusion lists identify the gaps.
  cosmos.base.v1beta1.DecCoin nominal_liability = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // self_held_supply lists Reserve-held members counted in nominal liability. These balances cannot
  // reach redemption directly and are netted from flow calculations. Uncounted lifecycle or
  // never-priced supply is excluded.
  repeated cosmos.base.v1beta1.Coin self_held_supply = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // self_held_liability values self_held_supply at exactly the rate the
  // aggregate valued it — fresh, settlement, or last known, whichever branch
  // counted it — so the two sides of the subtraction below can never price on
  // different bases.
  cosmos.base.v1beta1.DecCoin self_held_liability = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // net_liability is nominal liability minus self-held liability. Expansion gaps use it; redemption
  // coverage adds retired value to reconstruct its pre-burn basis. Committee bounds use nominal
  // liability because the committee can return self-held paper to circulation.
  cosmos.base.v1beta1.DecCoin net_liability = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // What the totals above exclude, in ascending order of permanence: a stale
  // feed is transient, a suspension holds until settlement, a write-off is
  // final. The first two zero every target; the third does not.

  // stale_member_supply lists ACTIVE or ISSUANCE_HALTED supply without fresh rates. Last-known
  // rates contribute stale-priced liability where available; a fresh observation restores ordinary
  // pricing without a lifecycle change.
  repeated cosmos.base.v1beta1.Coin stale_member_supply = 8 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // untrusted_suspended_supply is SUSPENDED supply with no open settlement:
  // explicit exposure, never zero, valuable by no honest rate.
  repeated cosmos.base.v1beta1.Coin untrusted_suspended_supply = 9 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // written_off_exposure is derecognised supply, disclosed but excluded from
  // recognised liability. It does not make the valuation incomplete.
  repeated WrittenOffExposure written_off_exposure = 10 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // Fund capital is compared with exposure-adjusted nominal *_target values for committee bounds
  // and net *_net_target values for expansion routing. Both target families are zero when valuation
  // is incomplete. Committee-operated funds report recognised capital, not raw custody.

  cosmos.base.v1beta1.Coin redemption_buffer_balance = 11 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin redemption_buffer_target = 12 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin redemption_buffer_net_target = 13 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin strategic_reserve_balance = 14 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin strategic_reserve_target = 15 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin strategic_reserve_net_target = 16 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // insurance_balance is the capital x/claims recognises toward its target,
  // which excludes the reservation held against approved pending claims. The
  // reservation itself is x/claims state, served by Query/ClaimsMandate.
  cosmos.base.v1beta1.Coin insurance_balance = 17 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin insurance_target = 18 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin insurance_net_target = 19 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // subsidy_pool_balance carries no target: it funds reward subsidy rather than
  // backing liability, so no ratio sizes it.
  cosmos.base.v1beta1.Coin subsidy_pool_balance = 20 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // exposure_multiplier scales both target families and is one when the risk model is inert. It
  // does not scale redemption coverage, whose basis is raw net liability plus retired value.
  string exposure_multiplier = 21 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryRewardFundingRequest is the request type for Query/RewardFunding.
message QueryRewardFundingRequest {}

// QueryRewardFundingResponse is the response type for Query/RewardFunding.
message QueryRewardFundingResponse {
  RewardFundingState reward_funding = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGasPriceRequest is the request type for Query/GasPrice.
message QueryGasPriceRequest {
  string denom = 1;
}

// QueryGasPriceResponse reports one accepted fee denomination's gas price.
// A denomination with no conversion factor is not an accepted fee denom and
// reports NotFound.
message QueryGasPriceResponse {
  GasPrice gas_price = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGasPricesRequest is the request type for Query/GasPrices.
message QueryGasPricesRequest {}

// QueryGasPricesResponse is the complete price sheet.
message QueryGasPricesResponse {
  // gas_prices lists every accepted non-reference denomination in
  // denomination order — NOAH among them. Presentation order only; the
  // reference is the dedicated field below, never a list entry.
  repeated GasPrice gas_prices = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // reference_gas_price is the reference row — the base gas price at the
  // identity factor. Always present: the reference prices unconditionally.
  GasPrice reference_gas_price = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryExposureStatusRequest is the request type for Query/ExposureStatus.
message QueryExposureStatusRequest {}

// QueryExposureStatusResponse reports the stored risk state and the one figure
// derived from it, so a reader can see both what is held and what the composite
// consumed without recomputing either.
message QueryExposureStatusResponse {
  ExposureState exposure_state = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // annualised_volatility is the square root of the stored variance scaled to a
  // year of blocks: the form the multiplier's volatility weight is denominated
  // against, and the only figure here the state does not carry directly.
  string annualised_volatility = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // refresh_pending reports an elapsed period whose recomputation has not yet
  // succeeded, so a multiplier that looks stale can be told apart from one that
  // is simply unchanged.
  bool refresh_pending = 3 [(amino.dont_omitempty) = true];
}
