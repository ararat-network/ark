syntax = "proto3";
package ark.reserve.v1;

import "amino/amino.proto";
import "ark/reserve/v1/reserve.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/reserve/types";

// GenesisState defines the reserve module's genesis state. Every position's
// proven legs are re-derived from the ledger at import and required to match.
// Positions arrive in two lists because they live in two stores.
message GenesisState {
  ReserveMandate mandate = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // recognition_policy is the governance-owned eligibility set, sorted by
  // asset denomination.
  repeated EligibilityEntry recognition_policy = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // allowance_used is the gross anoah deployed during the current term.
  cosmos.base.v1beta1.Coin allowance_used = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // open_positions each carry a zero closed_height.
  repeated Position open_positions = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // closed_positions each carry a nonzero closed_height.
  repeated Position closed_positions = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated AccountingEntry ledger = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 next_position_id = 7 [(amino.dont_omitempty) = true];
  uint64 next_entry_id = 8 [(amino.dont_omitempty) = true];
}
