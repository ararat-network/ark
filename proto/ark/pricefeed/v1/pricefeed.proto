syntax = "proto3";
package ark.pricefeed.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ararat-network/ark/pricefeed/api";

// PriceFeed defines the gRPC price-feed service the sidecar serves.
service PriceFeed {
  // Prices defines a method for fetching the latest prices.
  rpc Prices(PricesRequest) returns (PricesResponse) {
    option (google.api.http) = {get: "/ark/pricefeed/v1/prices"};
  }

  // Version defines a method for fetching the current version of the
  // price-feed service.
  rpc Version(VersionRequest) returns (VersionResponse) {
    option (google.api.http) = {get: "/ark/pricefeed/v1/version"};
  }
}

// PricesRequest defines the request type for the Prices method.
message PricesRequest {}

// PricesResponse defines the response type for the Prices method.
message PricesResponse {
  // Prices maps a feed denom to the minimal big-endian encoding of its
  // strictly positive raw price*10^18, where the price is NOAH per one unit
  // of the feed's denomination. Unpriced feeds are omitted.
  map<string, bytes> prices = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // Timestamp defines the timestamp of the prices.
  google.protobuf.Timestamp timestamp = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true,
    (amino.dont_omitempty) = true
  ];

  // Version defines the version of the price-feed service that provided the
  // prices.
  string version = 3;
}

// VersionRequest defines the request type for the Version method.
message VersionRequest {}

// VersionResponse defines the response type for the Version method.
message VersionResponse {
  // Version defines the current version of the price-feed service.
  string version = 1;
}
