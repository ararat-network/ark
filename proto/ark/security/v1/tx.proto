syntax = "proto3";
package ark.security.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/ararat-network/ark/x/security/types";

// Msg defines the security Msg service. Only the appointment is governance's
// here; every other method is the committee's bounded door to a power
// governance already holds unbounded through the upstream x/upgrade and IBC
// messages.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SetSecurityMandate appoints, replaces, or disables the security committee.
  rpc SetSecurityMandate(MsgSetSecurityMandate) returns (MsgSetSecurityMandateResponse) {}

  // CommitteePlanUpgrade schedules an emergency upgrade plan as the
  // security committee, when the pending plan slot is free or holds the
  // committee's own plan.
  rpc CommitteePlanUpgrade(MsgCommitteePlanUpgrade) returns (MsgCommitteePlanUpgradeResponse) {}

  // CommitteeCancelUpgrade cancels the committee's own pending upgrade plan.
  rpc CommitteeCancelUpgrade(MsgCommitteeCancelUpgrade) returns (MsgCommitteeCancelUpgradeResponse) {}

  // CommitteeRecoverClient substitutes an expired or frozen IBC client as the
  // security committee.
  rpc CommitteeRecoverClient(MsgCommitteeRecoverClient) returns (MsgCommitteeRecoverClientResponse) {}
}

// MsgSetSecurityMandate is the governance request for a complete security
// committee replacement. An empty committee disables the mandate; Security
// derives the next term on chain.
message MsgSetSecurityMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/security/MsgSetSecurityMandate";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // committee is the exact appointed account, empty to disable. A threshold
  // multisig is the intended shape; the chain sees only the account.
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
}

// MsgSetSecurityMandateResponse is the response for a security committee
// appointment, replacement, or disablement.
message MsgSetSecurityMandateResponse {}

// MsgCommitteePlanUpgrade schedules an emergency upgrade plan as the security
// committee, carrying the expected term so a transaction prepared against a
// replaced appointment fails rather than applying under a mandate its signers
// never saw. The committee may replace only its own pending plan: x/upgrade
// overwrites its single slot silently, so scheduling over a governance plan
// would displace a decision the chain already voted on.
message MsgCommitteePlanUpgrade {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/security/MsgCommitteePlanUpgrade";

  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  // name identifies the upgrade handler the patched binary must carry.
  string name = 3;
  // height is the block at which the chain halts for the upgrade, enforced by
  // x/upgrade to be in the future.
  int64 height = 4 [(amino.dont_omitempty) = true];
  // info carries the upgrade metadata operators read, conventionally the
  // binary locations.
  string info = 5;
}

// MsgCommitteePlanUpgradeResponse is the response type for
// MsgCommitteePlanUpgrade.
message MsgCommitteePlanUpgradeResponse {}

// MsgCommitteeCancelUpgrade cancels the committee's own pending upgrade plan.
// A governance plan is out of reach: cancelling one would clear the slot and
// let the committee schedule over a decision the chain voted on, so the
// committee can never affect a governance-scheduled upgrade.
message MsgCommitteeCancelUpgrade {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/security/MsgCommitteeCancelUpgrade";

  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
}

// MsgCommitteeCancelUpgradeResponse is the response type for
// MsgCommitteeCancelUpgrade.
message MsgCommitteeCancelUpgradeResponse {}

// MsgCommitteeRecoverClient substitutes an expired or frozen IBC client with
// an active one as the security committee. The deadline it races is set by the
// counterparty chain, not this one.
message MsgCommitteeRecoverClient {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/security/MsgCommitteeRecoverClient";

  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  // subject_client_id is the frozen or expired client being recovered.
  string subject_client_id = 3;
  // substitute_client_id is the active client whose state it adopts.
  string substitute_client_id = 4;
}

// MsgCommitteeRecoverClientResponse is the response type for
// MsgCommitteeRecoverClient.
message MsgCommitteeRecoverClientResponse {}
