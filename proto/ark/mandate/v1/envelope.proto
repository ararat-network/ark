syntax = "proto3";
package ark.mandate.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "ark/pkg/mandate";

// Envelope is the shared appointment envelope embedded by every
// governance-appointed committee mandate. An empty committee is the canonical
// disabled mandate, which still retains the latest term.
message Envelope {
  // term is the chain-derived monotonic appointment counter. It advances on
  // every replacement so previously prepared committee transactions cannot
  // become valid again.
  uint64 term = 1 [ (amino.dont_omitempty) = true ];
  // committee is the exact appointed account, empty when the mandate is
  // disabled.
  string committee = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // activation_height is the first height at which the committee may act.
  uint64 activation_height = 3 [ (amino.dont_omitempty) = true ];
  // expiry_height is the first height at which the committee may no longer
  // act, forming a half-open window with activation_height.
  uint64 expiry_height = 4 [ (amino.dont_omitempty) = true ];
}
