syntax = "proto3";
package ark.disbursement.v1;

import "amino/amino.proto";
import "ark/disbursement/v1/disbursement.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/disbursement/types";

// Msg defines the native disbursement transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  // UpdateParams replaces operational parameters without rewriting existing grants.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // SetRegistrarMandate appoints, replaces, or disables the registrar.
  rpc SetRegistrarMandate(MsgSetRegistrarMandate) returns (MsgSetRegistrarMandateResponse);
  // CreateGrant reserves a fully funded ownership or compensation award under governance authority.
  rpc CreateGrant(MsgCreateGrant) returns (MsgCreateGrantResponse);
  // CommitteeRegister permanently registers members and pays their first period atomically.
  rpc CommitteeRegister(MsgCommitteeRegister) returns (MsgCommitteeRegisterResponse);
  // Release pays currently available entitlement to the stored payees.
  rpc Release(MsgRelease) returns (MsgReleaseResponse);
  // CancelGrants freezes earned debt and frees only unearned principal without paying recipients.
  rpc CancelGrants(MsgCancelGrants) returns (MsgCancelGrantsResponse);
  // CommitteeSuspend pauses member payments under the live registrar term.
  rpc CommitteeSuspend(MsgCommitteeSuspend) returns (MsgCommitteeSuspendResponse);
  // CommitteeReinstate resumes suspended members under the live registrar term.
  rpc CommitteeReinstate(MsgCommitteeReinstate) returns (MsgCommitteeReinstateResponse);
  // ReinstateMembers resumes suspended members under governance authority.
  rpc ReinstateMembers(MsgReinstateMembers) returns (MsgReinstateMembersResponse);
  // VoidSuspensions invalidates every suspension made under a replaced registrar term.
  rpc VoidSuspensions(MsgVoidSuspensions) returns (MsgVoidSuspensionsResponse);
  // SetPayee changes a destination under member or contributor controller authority.
  rpc SetPayee(MsgSetPayee) returns (MsgSetPayeeResponse);
  // SetController rotates contributor control without changing beneficiary identity.
  rpc SetController(MsgSetController) returns (MsgSetControllerResponse);
  // ReturnUnallocated returns unreserved custody to the community pool under governance authority.
  rpc ReturnUnallocated(MsgReturnUnallocated) returns (MsgReturnUnallocatedResponse);
}

// MsgUpdateParams replaces operational parameters without rewriting existing grants.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgUpdateParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse reports the result of UpdateParams.
message MsgUpdateParamsResponse {}

// MsgSetRegistrarMandate appoints, replaces, or disables the registrar. An empty committee
// disables; the chain derives the next term.
message MsgSetRegistrarMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgSetRegistrarMandate";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // committee is the exact appointed account, empty to disable.
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
}

// MsgSetRegistrarMandateResponse reports the result of SetRegistrarMandate.
message MsgSetRegistrarMandateResponse {}

// MsgCreateGrant reserves a fully funded ownership or compensation award under governance authority.
message MsgCreateGrant {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgCreateGrant";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  GrantKind kind = 2;
  string beneficiary = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Period schedule = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string reference = 6;
}

// MsgCreateGrantResponse reports the result of CreateGrant.
message MsgCreateGrantResponse {
  uint64 grant_id = 1 [(amino.dont_omitempty) = true];
}

// MsgCommitteeRegister permanently registers members and pays their first period atomically.
message MsgCommitteeRegister {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/disbursement/MsgCommitteeRegister";
  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  repeated string addresses = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgCommitteeRegisterResponse reports the result of CommitteeRegister.
message MsgCommitteeRegisterResponse {
  repeated uint64 grant_ids = 1;
}

// MsgRelease pays currently available entitlement to the stored payees.
message MsgRelease {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "ark/disbursement/MsgRelease";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated uint64 grant_ids = 2;
}

// MsgReleaseResponse reports the result of Release.
message MsgReleaseResponse {}

// MsgCancelGrants freezes earned debt and frees only unearned principal without paying recipients.
message MsgCancelGrants {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgCancelGrants";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated uint64 grant_ids = 2;
}

// MsgCancelGrantsResponse reports the result of CancelGrants.
message MsgCancelGrantsResponse {}

// MsgCommitteeSuspend pauses member payments under the live registrar term.
message MsgCommitteeSuspend {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/disbursement/MsgCommitteeSuspend";
  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  repeated string addresses = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgCommitteeSuspendResponse reports the result of CommitteeSuspend.
message MsgCommitteeSuspendResponse {}

// MsgCommitteeReinstate resumes suspended members under the live registrar term.
message MsgCommitteeReinstate {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/disbursement/MsgCommitteeReinstate";
  string committee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_term = 2 [(amino.dont_omitempty) = true];
  repeated string addresses = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgCommitteeReinstateResponse reports the result of CommitteeReinstate.
message MsgCommitteeReinstateResponse {}

// MsgReinstateMembers resumes suspended members under governance authority.
message MsgReinstateMembers {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgReinstateMembers";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string addresses = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgReinstateMembersResponse reports the result of ReinstateMembers.
message MsgReinstateMembersResponse {}

// MsgVoidSuspensions invalidates every suspension made under a replaced registrar term.
message MsgVoidSuspensions {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgVoidSuspensions";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // term is a registrar term below the current one.
  uint64 term = 2 [(amino.dont_omitempty) = true];
}

// MsgVoidSuspensionsResponse reports the result of VoidSuspensions.
message MsgVoidSuspensionsResponse {}

// MsgSetPayee changes a destination under member or contributor controller authority.
message MsgSetPayee {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "ark/disbursement/MsgSetPayee";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2 [(amino.dont_omitempty) = true];
  string payee = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgSetPayeeResponse reports the result of SetPayee.
message MsgSetPayeeResponse {}

// MsgSetController rotates contributor control without changing beneficiary identity.
message MsgSetController {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "ark/disbursement/MsgSetController";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string beneficiary = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgSetControllerResponse reports the result of SetController.
message MsgSetControllerResponse {}

// MsgReturnUnallocated returns unreserved custody to the community pool under governance authority.
message MsgReturnUnallocated {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/disbursement/MsgReturnUnallocated";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgReturnUnallocatedResponse reports the result of ReturnUnallocated.
message MsgReturnUnallocatedResponse {}
