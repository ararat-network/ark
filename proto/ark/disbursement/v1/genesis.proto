syntax = "proto3";
package ark.disbursement.v1;

import "amino/amino.proto";
import "ark/disbursement/v1/disbursement.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/disbursement/types";

// GenesisState exports grant obligations and their audit history; Bank exports custody balances.
message GenesisState {
  // Policy and appointment.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  GrantsMandate grants_mandate = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  RegistrarMandate registrar_mandate = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // compensation_used is the live term's charges against its allowance, cancelled awards
  // included; an appointment resets it.
  string compensation_used = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Records.
  repeated Beneficiary beneficiaries = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Grant grants = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Accounting: each module account's reservations, and the member tranche, contributors first.
  repeated AccountBook books = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Ledgers.
  repeated GrantEntry grant_journal = 8 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated BeneficiaryEntry beneficiary_journal = 9 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Sequences.
  uint64 next_grant_id = 10 [(amino.dont_omitempty) = true];
  uint64 next_grant_entry_id = 11 [(amino.dont_omitempty) = true];
  uint64 next_beneficiary_entry_id = 12 [(amino.dont_omitempty) = true];
}
