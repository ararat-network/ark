syntax = "proto3";
package ark.disbursement.v1;

import "amino/amino.proto";
import "ark/disbursement/v1/disbursement.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/ararat-network/ark/x/disbursement/types";

// Query exposes grant records, obligations and their audit history.
service Query {
  // Params queries the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/params";
  }
  // GrantsMandate queries the committee appointment, whether it is active, and the term's
  // compensation usage.
  rpc GrantsMandate(QueryGrantsMandateRequest) returns (QueryGrantsMandateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/grants_mandate";
  }
  // RegistrarMandate queries the registrar appointment and whether it is active.
  rpc RegistrarMandate(QueryRegistrarMandateRequest) returns (QueryRegistrarMandateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/registrar_mandate";
  }
  // Balance shows each account's custody beside its reservations, and the member tranche.
  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/balance";
  }
  // Grant queries one grant by ID.
  rpc Grant(QueryGrantRequest) returns (QueryGrantResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/grants/{id}";
  }
  // Grants lists grants in ID order: all, one beneficiary's, one committee term's awards, one
  // registrar term's registrations, or one kind's.
  rpc Grants(QueryGrantsRequest) returns (QueryGrantsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/grants";
  }
  // GrantJournal lists grant entries by grant, then entry: all, or one grant's.
  rpc GrantJournal(QueryGrantJournalRequest) returns (QueryGrantJournalResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/grant_journal";
  }
  // Member queries one member's grant.
  rpc Member(QueryMemberRequest) returns (QueryMemberResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/members/{address}";
  }
  // Members lists member grants in address order.
  rpc Members(QueryMembersRequest) returns (QueryMembersResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/members";
  }
  // Beneficiary queries one beneficiary record and the ownership it can still be awarded.
  rpc Beneficiary(QueryBeneficiaryRequest) returns (QueryBeneficiaryResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/beneficiaries/{address}";
  }
  // BeneficiaryJournal lists one beneficiary's controller changes in ID order.
  rpc BeneficiaryJournal(QueryBeneficiaryJournalRequest) returns (QueryBeneficiaryJournalResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/disbursement/v1/beneficiaries/{address}/journal";
  }
}

// QueryParamsRequest requests Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse returns Query/Params.
message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGrantsMandateRequest requests Query/GrantsMandate.
message QueryGrantsMandateRequest {}

// QueryGrantsMandateResponse returns Query/GrantsMandate.
message QueryGrantsMandateResponse {
  GrantsMandate mandate = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // active reports whether the committee may act at the current block time.
  bool active = 2 [(amino.dont_omitempty) = true];
  // compensation_used sums the live term's charges, cancelled awards included.
  string compensation_used = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // compensation_remaining is the term's allowance less compensation_used.
  string compensation_remaining = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryRegistrarMandateRequest requests Query/RegistrarMandate.
message QueryRegistrarMandateRequest {}

// QueryRegistrarMandateResponse returns Query/RegistrarMandate.
message QueryRegistrarMandateResponse {
  RegistrarMandate mandate = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // active reports whether the registrar may act at the current block time.
  bool active = 2 [(amino.dont_omitempty) = true];
}

// QueryBalanceRequest requests Query/Balance.
message QueryBalanceRequest {
  // denom selects one denomination; empty selects NOAH and every registered asset the account
  // holds, which is everything Bank admits into custody.
  string denom = 1;
}

// QueryBalanceResponse returns Query/Balance, contributors first.
message QueryBalanceResponse {
  // accounts holds one entry per account and denomination: contributors always, members for NOAH.
  repeated AccountBalance accounts = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // member_tranche is the member NOAH open to registration, part of the member pool's uncommitted
  // NOAH.
  string member_tranche = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// AccountBalance is one account's custody in a denomination and how it is committed.
message AccountBalance {
  // account is the module account: disbursement_members or disbursement_contributors.
  string account = 1;
  cosmos.base.v1beta1.Coin balance = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin reserved = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // uncommitted is the pool for NOAH; custody outside grants otherwise.
  cosmos.base.v1beta1.Coin uncommitted = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGrantRequest requests Query/Grant.
message QueryGrantRequest {
  uint64 id = 1 [(amino.dont_omitempty) = true];
}

// QueryGrantResponse returns Query/Grant.
message QueryGrantResponse {
  Grant grant = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGrantsRequest requests Query/Grants.
message QueryGrantsRequest {
  string beneficiary = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // committee_term lists one committee term's awards; registrar_term one registrar term's
  // registrations; kind one kind's grants. The four filters exclude one another.
  uint64 committee_term = 2;
  uint64 registrar_term = 3;
  cosmos.base.query.v1beta1.PageRequest pagination = 4;
  GrantKind kind = 5;
}

// QueryGrantsResponse returns Query/Grants.
message QueryGrantsResponse {
  repeated Grant grants = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGrantJournalRequest requests Query/GrantJournal.
message QueryGrantJournalRequest {
  uint64 grant_id = 1 [(amino.dont_omitempty) = true];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryGrantJournalResponse returns Query/GrantJournal.
message QueryGrantJournalResponse {
  repeated GrantEntry entries = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryMemberRequest requests Query/Member.
message QueryMemberRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryMemberResponse returns Query/Member.
message QueryMemberResponse {
  Grant grant = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryMembersRequest requests Query/Members.
message QueryMembersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryMembersResponse returns one page of member grants.
message QueryMembersResponse {
  repeated Grant grants = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryBeneficiaryRequest requests Query/Beneficiary.
message QueryBeneficiaryRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryBeneficiaryResponse returns Query/Beneficiary.
message QueryBeneficiaryResponse {
  Beneficiary beneficiary = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // ownership_remaining is the ownership the record can still be awarded: the cap less
  // ownership_committed.
  string ownership_remaining = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryBeneficiaryJournalRequest requests Query/BeneficiaryJournal.
message QueryBeneficiaryJournalRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryBeneficiaryJournalResponse returns Query/BeneficiaryJournal in ID order.
message QueryBeneficiaryJournalResponse {
  repeated BeneficiaryEntry entries = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
