syntax = "proto3";
package ark.disbursement.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/disbursement/types";

// GrantKind selects the entitlement and ownership rules.
enum GrantKind {
  // GRANT_KIND_UNSPECIFIED is invalid.
  GRANT_KIND_UNSPECIFIED = 0;
  // GRANT_KIND_MEMBER identifies member payments.
  GRANT_KIND_MEMBER = 1;
  // GRANT_KIND_OWNERSHIP identifies ownership payments.
  GRANT_KIND_OWNERSHIP = 2;
  // GRANT_KIND_COMPENSATION identifies compensation payments.
  GRANT_KIND_COMPENSATION = 3;
}

// Pool names a NOAH distribution pool held from genesis.
enum Pool {
  // POOL_UNSPECIFIED is custody outside both pools.
  POOL_UNSPECIFIED = 0;
  // POOL_MEMBERS funds member grants and has no exit.
  POOL_MEMBERS = 1;
  // POOL_CONTRIBUTORS funds ownership, NOAH compensation, and conversions; governance can return it.
  POOL_CONTRIBUTORS = 2;
}

// Period allocates a fraction of a commitment after a duration in seconds.
message Period {
  option (gogoproto.equal) = true;
  uint64 length = 1 [(amino.dont_omitempty) = true];
  uint64 parts = 2 [(amino.dont_omitempty) = true];
}

// Params defines operational policy; existing commitments retain their original terms.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/disbursement/Params";
  uint64 max_members = 1 [(amino.dont_omitempty) = true];
  uint64 window_seconds = 2 [(amino.dont_omitempty) = true];
  string member_amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Period member_schedule = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated string compensation_denoms = 5;
}

// GrantsMandate appoints the grants committee for a height window. An empty committee
// disables it; every replacement advances the term.
message GrantsMandate {
  ark.mandate.v1.Envelope envelope = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // compensation_allowance caps the term's awards per denomination; a cancel does not restore it.
  repeated cosmos.base.v1beta1.Coin compensation_allowance = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins",
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // min_first_period is the shortest first period, in seconds, a committee award may have.
  uint64 min_first_period = 3 [(amino.dont_omitempty) = true];
}

// OwnershipPolicy fixes ownership limits at genesis; ordinary messages cannot change it.
message OwnershipPolicy {
  uint64 numerator = 1 [(amino.dont_omitempty) = true];
  uint64 denominator = 2 [(amino.dont_omitempty) = true];
  string ceiling = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Beneficiary anchors contributor identity independently of controller and payee rotation.
message Beneficiary {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string controller = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string ownership_paid = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // seat is the founding seat principal, set only at genesis; zero for a non-founder.
  string seat = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Suspension stops member payments until reinstated or its term is voided.
message Suspension {
  uint64 at = 1 [(amino.dont_omitempty) = true];
  // term is the committee appointment the suspension was made under.
  uint64 term = 2 [(amino.dont_omitempty) = true];
}

// Grant stores immutable award terms and the settlement of that obligation.
message Grant {
  uint64 id = 1 [(amino.dont_omitempty) = true];
  GrantKind kind = 2;
  string beneficiary = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string payee = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Period schedule = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 start_time = 7 [(amino.dont_omitempty) = true];
  string paid = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string remaining = 9 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string cancelled_amount = 10 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  bool cancelled = 11 [(amino.dont_omitempty) = true];
  uint64 cutoff_time = 12 [(amino.dont_omitempty) = true];
  Suspension suspension = 13;
  string reference = 14;
  string created_by = 15 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 created_height = 16 [(amino.dont_omitempty) = true];
  // mandate_term is the committee term that awarded this compensation; zero otherwise.
  uint64 mandate_term = 17 [(amino.dont_omitempty) = true];
}

// DenomTotals separates custody obligations and payments by denomination and purpose.
message DenomTotals {
  string denom = 1;
  string reserved = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string members_paid = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string ownership_paid = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string compensation_paid = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// PoolBalance is a pool's uncommitted NOAH; open is the part governance has opened to new grants.
message PoolBalance {
  string unallocated = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string open = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// ConversionOrder is governance's standing instruction to convert contributor NOAH into denom.
message ConversionOrder {
  string denom = 1;
  // remaining is the NOAH still to convert; it left the contributor pool when authorised.
  string remaining = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // max_spread bounds each execution's realised spread, dust included.
  string max_spread = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// IssuanceEntry counts registrations at one block time within the rolling issuance window.
message IssuanceEntry {
  uint64 at = 1 [(amino.dont_omitempty) = true];
  uint64 count = 2 [(amino.dont_omitempty) = true];
}

// Issuance holds the bounded rolling registration log.
message Issuance {
  repeated IssuanceEntry entries = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// JournalEntry is an append-only account of a module operation; details contain its bounded JSON facts.
message JournalEntry {
  uint64 id = 1 [(amino.dont_omitempty) = true];
  uint64 grant_id = 2 [(amino.dont_omitempty) = true];
  string action = 3;
  string actor = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 height = 5 [(amino.dont_omitempty) = true];
  uint64 time = 6 [(amino.dont_omitempty) = true];
  cosmos.base.v1beta1.Coin amount = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string details = 8;
}
