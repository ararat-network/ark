syntax = "proto3";
package ark.market.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "ark/market/v1/market.proto";

option go_package = "ark/x/market/types";

// Query defines the gRPC querier service.
service Query {
  // Swap returns simulated swap amount.
  rpc Swap(QuerySwapRequest) returns (QuerySwapResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/market/v1/swap";
  }

  // ArkPoolDelta returns ark_pool_delta amount.
  rpc ArkPoolDelta(QueryArkPoolDeltaRequest)
      returns (QueryArkPoolDeltaResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/market/v1/ark_pool_delta";
  }

  // Params queries all parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/ark/market/v1/params";
  }
}

// QuerySwapRequest is the request type for the Query/Swap RPC method.
message QuerySwapRequest {
  // offer_coin defines the coin being offered (i.e. 1000000000000000000anoah)
  string offer_coin = 1;
  // ask_denom defines the denom of the coin to swap to
  string ask_denom = 2;
}

// QuerySwapResponse is the response type for the Query/Swap RPC method.
message QuerySwapResponse {
  // return_coin defines the coin returned as a result of the swap simulation.
  cosmos.base.v1beta1.Coin swap_coin = 1 [ (gogoproto.nullable) = false ];
  // swap_fee defines the fee deducted from the simulated swap result.
  cosmos.base.v1beta1.DecCoin swap_fee = 2 [ (gogoproto.nullable) = false ];
}

// QueryArkPoolDeltaRequest is the request type for the Query/ArkPoolDelta RPC
// method.
message QueryArkPoolDeltaRequest {}

// QueryArkPoolDeltaResponse is the response type for the Query/ArkPoolDelta
// RPC method.
message QueryArkPoolDeltaResponse {
  // ark_pool_delta defines the signed gap between the ArkPool and BasePool in
  // pool_denom units.
  string ark_pool_delta = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // pool_denom defines the denomination of ark_pool_delta.
  string pool_denom = 2;
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
