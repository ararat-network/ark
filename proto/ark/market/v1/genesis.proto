syntax = "proto3";
// SPDX-License-Identifier: Apache-2.0
// Originates from Ark's Terra Classic port of proto/terra/market/v1beta1/genesis.proto.
// Modified for Ark: market schema and modern SDK integration.
// See NOTICE and THIRD_PARTY_NOTICES.md for upstream attribution.
package ark.market.v1;

import "amino/amino.proto";
import "ark/market/v1/market.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/market/types";

// GenesisState defines the market module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // ark_pool_delta is the signed gap between the ArkPool and BasePool measured
  // in conversion_policy.base_pool.denom.
  string ark_pool_delta = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // tobin_tax_overrides are the sparse per-denomination Tobin exceptions,
  // sorted by unique denomination.
  repeated TobinTaxOverride tobin_tax_overrides = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // conversion_policy is the live conversion-capacity pair. Its base pool must
  // be denominated in the configured protocol reference.
  ConversionPolicy conversion_policy = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // conversion_mandate is the governed conversion committee appointment,
  // disabled at launch.
  ConversionMandate conversion_mandate = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
