syntax = "proto3";
package ark.market.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/ararat-network/ark/x/market/types";

// EventSwap is emitted after a Market swap settles successfully.
message EventSwap {
  string trader = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string recipient = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string offer_denom = 3;
  string offer_amount = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string swap_denom = 5;
  string swap_amount = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string fee_denom = 7;
  string fee_amount = 8 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventPoolUpdated is emitted after a Market virtual-pool update succeeds.
message EventPoolUpdated {
  string old_base_pool_denom = 1;
  string old_base_pool_amount = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string new_base_pool_denom = 3;
  string new_base_pool_amount = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string old_ark_pool_delta = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string new_ark_pool_delta = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventSettle is emitted after a settlement redemption executes. It is
// distinct from EventSwap because the rate is the plan's, not the oracle's,
// and no pool state moves.
message EventSettle {
  string trader = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string offer_denom = 2;
  string offer_amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // redeemed_amount is the NOAH paid to the trader, whole entitlement
  // regardless of how much of it the shared buffer covered.
  string redeemed_amount = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // redemption_rate is the plan rate the redemption executed at, in NOAH per
  // one unit of the settled asset — the same orientation as oracle exchange
  // rates.
  string redemption_rate = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventTobinTaxOverrideSet is emitted when governance or the conversion
// committee creates or replaces one per-denomination Tobin exception.
message EventTobinTaxOverrideSet {
  string denom = 1;
  string tobin_tax = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EventTobinTaxOverrideRemoved is emitted when governance deletes one
// per-denomination Tobin exception, returning that denomination to the
// default rate.
message EventTobinTaxOverrideRemoved {
  string denom = 1;
}

// EventConversionMandateSet is emitted when governance appoints, replaces, or
// disables the conversion committee. A disabling carries the empty committee
// and the advanced term.
message EventConversionMandateSet {
  uint64 term = 1 [(amino.dont_omitempty) = true];
  string committee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 activation_height = 3 [(amino.dont_omitempty) = true];
  uint64 expiry_height = 4 [(amino.dont_omitempty) = true];
  // committee_shape is the appointment-time observation of the committee
  // account, zeroed on a disabling.
  ark.mandate.v1.CommitteeShape committee_shape = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
