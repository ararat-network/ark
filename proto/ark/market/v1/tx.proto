syntax = "proto3";
package ark.market.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "ark/market/v1/market.proto";

option go_package = "ark/x/market/types";

// Msg defines the market Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Swap defines a method for swapping coin from one denom to another
  // denom.
  rpc Swap(MsgSwap) returns (MsgSwapResponse);

  // SwapSend defines a method for swapping and sending coin from a account to
  // other account.
  rpc SwapSend(MsgSwapSend) returns (MsgSwapSendResponse);

  // Settle redeems a suspended asset against its governance-approved
  // settlement plan.
  rpc Settle(MsgSettle) returns (MsgSettleResponse);

  // UpdateParams defines an operation for updating the x/market module
  // parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {}

  // SetTobinTaxOverride creates or replaces one per-denomination Tobin
  // exception.
  rpc SetTobinTaxOverride(MsgSetTobinTaxOverride)
      returns (MsgSetTobinTaxOverrideResponse) {}

  // RemoveTobinTaxOverride deletes one per-denomination Tobin exception.
  rpc RemoveTobinTaxOverride(MsgRemoveTobinTaxOverride)
      returns (MsgRemoveTobinTaxOverrideResponse) {}

  // SetConversionMandate appoints, replaces, or disables the bounded conversion
  // committee.
  rpc SetConversionMandate(MsgSetConversionMandate)
      returns (MsgSetConversionMandateResponse) {}

  // UpdatePolicy applies one complete conversion candidate as the
  // governance authority, unbounded by the committee mandate.
  rpc UpdatePolicy(MsgUpdatePolicy) returns (MsgUpdatePolicyResponse) {}

  // CommitteeUpdatePolicy applies one complete conversion candidate as
  // the conversion committee, inside its mandate bounds.
  rpc CommitteeUpdatePolicy(MsgCommitteeUpdatePolicy)
      returns (MsgCommitteeUpdatePolicyResponse) {}

  // CommitteeSetTobinTax creates or replaces one per-denomination Tobin
  // override as the conversion committee, inside the band the mandate
  // delegates.
  rpc CommitteeSetTobinTax(MsgCommitteeSetTobinTax)
      returns (MsgCommitteeSetTobinTaxResponse) {}
}

// MsgSwap represents a message to swap coin to another denom.
message MsgSwap {
  option (cosmos.msg.v1.signer) = "trader";
  option (amino.name) = "ark/x/market/MsgSwap";

  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin offer_coin = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string ask_denom = 3;
  // minimum_receive is the optional minimum ask-denom coin the trader
  // accepts; the swap fails if the final output is lower. The zero coin means
  // the trader accepts market execution — absence is the only spelling of
  // that intent, so a denominated zero is rejected as a probable caller bug
  // rather than read as a second way to opt out.
  cosmos.base.v1beta1.Coin minimum_receive = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgSwapResponse defines the Msg/Swap response type.
message MsgSwapResponse {
  cosmos.base.v1beta1.Coin swap_coin = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.DecCoin swap_fee = 2 [ (gogoproto.nullable) = false ];
}

// MsgSwapSend represents a message to swap coin and send all result coin to
// recipient
message MsgSwapSend {
  option (cosmos.msg.v1.signer) = "from_address";
  option (amino.name) = "ark/x/market/MsgSwapSend";

  string from_address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string to_address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin offer_coin = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string ask_denom = 4;
  // minimum_receive is the optional minimum ask-denom coin the sender
  // accepts; the swap fails if the final output is lower. The zero coin means
  // the sender accepts market execution — absence is the only spelling of
  // that intent, so a denominated zero is rejected as a probable caller bug
  // rather than read as a second way to opt out.
  cosmos.base.v1beta1.Coin minimum_receive = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgSwapSendResponse defines the Msg/SwapSend response type.
message MsgSwapSendResponse {
  cosmos.base.v1beta1.Coin swap_coin = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.DecCoin swap_fee = 2 [ (gogoproto.nullable) = false ];
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/market/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the x/market parameters to update.
  //
  // NOTE: All parameters must be supplied. The conversion dials are not here:
  // pool depth, the recovery period, and the stability-spread floor are
  // committee-delegable, so they move through MsgUpdatePolicy and never through
  // this whole-object replacement.
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgSettle redeems a suspended asset against its governance-approved
// settlement plan: asset to NOAH only, at the plan rate, burning the offer.
// This is the suspended holder's exit, so it is signed by the holder rather
// than by governance, and the plan rate never reaches ordinary routing or
// reverse issuance.
message MsgSettle {
  option (cosmos.msg.v1.signer) = "trader";
  option (amino.name) = "ark/x/market/MsgSettle";

  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin offer_coin = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgSettleResponse defines the Msg/Settle response type.
message MsgSettleResponse {
  cosmos.base.v1beta1.Coin redeemed_coin = 1 [ (gogoproto.nullable) = false ];
}

// MsgSetTobinTaxOverride creates or replaces one per-denomination Tobin
// exception. The denomination must identify a registered asset — PENDING
// counts, so a listing proposal can set the override before the asset ever
// goes live — because a dangling override fails silently: the protection it
// was written for would simply not exist on the real denomination.
message MsgSetTobinTaxOverride {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/market/MsgSetTobinTaxOverride";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string denom = 2;
  string tobin_tax = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgSetTobinTaxOverrideResponse is the response type for
// MsgSetTobinTaxOverride.
message MsgSetTobinTaxOverrideResponse {}

// MsgRemoveTobinTaxOverride deletes one per-denomination Tobin exception. The
// entry must exist, so a typo fails loudly, but the asset registry is
// deliberately not consulted: an entry left behind by a retired asset must
// stay removable.
message MsgRemoveTobinTaxOverride {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/market/MsgRemoveTobinTaxOverride";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string denom = 2;
}

// MsgRemoveTobinTaxOverrideResponse is the response type for
// MsgRemoveTobinTaxOverride.
message MsgRemoveTobinTaxOverrideResponse {}

// MsgSetConversionMandate is the governance request for a complete conversion
// committee replacement. An empty committee disables the mandate; Market
// derives the next term on chain.
//
// Both bounds must be denominated in the live pool unit. A corridor in any
// other denomination could never authorize an action, and a mandate that cannot
// act is discovered when the committee musters — the worst moment to find out —
// so appointment rejects it instead.
message MsgSetConversionMandate {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/market/MsgSetConversionMandate";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string committee = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 activation_height = 3 [ (amino.dont_omitempty) = true ];
  uint64 expiry_height = 4 [ (amino.dont_omitempty) = true ];
  ConversionPolicy minimum_policy = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  ConversionPolicy maximum_policy = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // max_tobin_tax is the upper edge of the committee's Tobin band for this
  // appointment; the lower edge is Params.default_tobin_tax. An enabled
  // appointment states the cap explicitly like every other bound — zero, not
  // omission, is how a capacity-only committee is spelled. (On the wire the
  // two are the same bytes; the distinction binds genesis files and direct
  // callers.)
  string max_tobin_tax = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgSetConversionMandateResponse is the response for a committee appointment,
// replacement, or disablement.
message MsgSetConversionMandateResponse {}

// MsgUpdatePolicy is a governance-signed conversion update. Governance
// applies any structurally valid candidate, so it carries no expected term: its
// authorization never depends on the committee mandate.
message MsgUpdatePolicy {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ark/x/market/MsgUpdatePolicy";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // policy is the complete conversion pair to apply. The base pool denomination
  // must match the live pool: re-denomination happens only through
  // MsgSetReference.
  ConversionPolicy policy = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdatePolicyResponse is the response type for
// MsgUpdatePolicy.
message MsgUpdatePolicyResponse {}

// MsgCommitteeUpdatePolicy is a conversion-committee-signed update. It
// carries the expected term so a transaction prepared against a replaced
// appointment fails rather than applying under a mandate its signers never saw.
message MsgCommitteeUpdatePolicy {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/x/market/MsgCommitteeUpdatePolicy";

  string committee = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 expected_term = 2 [ (amino.dont_omitempty) = true ];
  ConversionPolicy policy = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgCommitteeUpdatePolicyResponse is the response type for
// MsgCommitteeUpdatePolicy.
message MsgCommitteeUpdatePolicyResponse {}

// MsgCommitteeSetTobinTax creates or replaces one per-denomination Tobin
// override as the conversion committee. The new rate must fall in
// [Params.default_tobin_tax, mandate.max_tobin_tax] — a band with a
// governance-owned edge at each end, the same shape as the policy corridor —
// so the committee may widen a denomination's oracle-staleness buffer during an
// incident and narrow it again once the incident passes, without either edge
// moving.
//
// Only governance may take a denomination below the default or return it to
// tracking the default, through MsgSetTobinTaxOverride and
// MsgRemoveTobinTaxOverride.
message MsgCommitteeSetTobinTax {
  option (cosmos.msg.v1.signer) = "committee";
  option (amino.name) = "ark/x/market/MsgCommitteeSetTobinTax";

  string committee = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 expected_term = 2 [ (amino.dont_omitempty) = true ];
  string denom = 3;
  string tobin_tax = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgCommitteeSetTobinTaxResponse is the response type for
// MsgCommitteeSetTobinTax.
message MsgCommitteeSetTobinTaxResponse {}
