syntax = "proto3";
package ark.transport.v1;

option go_package = "ark/oracle/types";

// OracleAdmin defines process-local oracle administration operations.
service OracleAdmin {
  // ReloadConfig reloads the runtime config file used to construct the oracle.
  rpc ReloadConfig(OracleReloadConfigRequest)
      returns (OracleReloadConfigResponse);
}

// OracleReloadConfigRequest defines the request for ReloadConfig.
message OracleReloadConfigRequest {}

// OracleReloadConfigResponse defines the response for ReloadConfig.
message OracleReloadConfigResponse {}
