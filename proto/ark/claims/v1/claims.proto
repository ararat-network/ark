syntax = "proto3";
package ark.claims.v1;

import "amino/amino.proto";
import "ark/mandate/v1/envelope.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "ark/x/claims/types";

// ClaimStatus defines the lifecycle state of a claim.
enum ClaimStatus {
  // CLAIM_STATUS_UNSPECIFIED is invalid.
  CLAIM_STATUS_UNSPECIFIED = 0;
  // CLAIM_STATUS_PENDING identifies a committee- or governance-submitted,
  // encumbered claim in its cancellation period.
  CLAIM_STATUS_PENDING = 1;
  // CLAIM_STATUS_PAID identifies a claim the chain settled itself once its
  // cancellation period had passed.
  CLAIM_STATUS_PAID = 2;
  // CLAIM_STATUS_CANCELLED identifies a claim cancelled by the committee or
  // governance authority during its cancellation period.
  CLAIM_STATUS_CANCELLED = 3;
  // CLAIM_STATUS_FAILED identifies a claim the chain could not pay when it
  // came due. Its reservation is released with it: a claim that will not be
  // paid must not go on encumbering Insurance.
  CLAIM_STATUS_FAILED = 4;
}

// ClaimAuthority names an authority domain in the Claims module. A claim
// records the domain that submitted it and, if it was vetoed, the domain that
// cancelled it — two roles drawn from the one set of authorities.
enum ClaimAuthority {
  // CLAIM_AUTHORITY_UNSPECIFIED is invalid as an origin, and identifies a
  // claim nobody cancelled.
  CLAIM_AUTHORITY_UNSPECIFIED = 0;
  // CLAIM_AUTHORITY_COMMITTEE identifies the appointed Claims committee.
  CLAIM_AUTHORITY_COMMITTEE = 1;
  // CLAIM_AUTHORITY_GOVERNANCE identifies the governance authority.
  CLAIM_AUTHORITY_GOVERNANCE = 2;
}

// Params defines the governance-owned parameters for the claims module.
message Params {
  option (gogoproto.equal) = true;
  option (amino.name) = "ark/claims/Params";

  // claim_cancellation_period_blocks is the shared veto window between any
  // claim's submission and its executable height, for both origins.
  // Governance owns it, so replacing the Claims mandate never changes it.
  uint64 claim_cancellation_period_blocks = 1 [ (amino.dont_omitempty) = true ];
}

// ClaimsMandate stores one governance-created, height-scoped Claims committee
// appointment and the fixed gross claim limit delegated to that committee for
// the term. An empty committee identifies a disabled mandate; term still
// increases on replacement so old committee transactions cannot become valid
// again.
message ClaimsMandate {
  // envelope carries the shared term, committee, and half-open height window.
  ark.mandate.v1.Envelope envelope = 1 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.v1beta1.Coin committee_claim_limit = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// Claim stores an immutable submitted claim and its final state.
message Claim {
  uint64 claim_id = 1 [ (amino.dont_omitempty) = true ];
  string submitter = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  ClaimAuthority origin = 3;
  // mandate_term records the committee appointment that authorized the claim;
  // zero for governance claims, which do not depend on the Claims mandate.
  uint64 mandate_term = 4 [ (amino.dont_omitempty) = true ];
  // reference is the required, bounded pointer to the off-chain case record
  // behind the claim — the incident and the evidence backing it alike. The
  // chain stores it and never interprets it.
  string reference = 5;
  string recipient = 6 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin amount = 7
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  ClaimStatus status = 8;
  uint64 submitted_height = 9;
  uint64 closing_height = 10;
  ClaimAuthority cancelled_by = 11;
}
