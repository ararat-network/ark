# Scope for the CodeQL scan. Queries and packs stay in the workflow; this
# file only says what is worth scanning.
name: ark

# Exclude alerts anchored in generated files while retaining their compiled dataflow. The action
# applies path filters during result processing; local CLI analysis does not reproduce that
# filtering. See tests/README.md.
paths-ignore:
  - api
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/*.pulsar.go"
