# Scope for the CodeQL scan. Queries and packs stay in the workflow; this
# file only says what is worth scanning.
name: ark

# Generated code is excluded because a finding in it is not actionable: the
# file is regenerated by `make proto-gen` and carries a DO NOT EDIT banner,
# so the only way to act on an alert would be to change the generator. It is
# also most of the noise -- every one of the pack's sensitive-import hits
# lands in a .pulsar.go file, which is the single largest rule count in an
# unfiltered run.
#
# For a compiled language this filters findings rather than extraction:
# generated code is still built and still provides call targets for dataflow
# reaching hand-written code, and only the alerts anchored inside generated
# files are dropped. That filtering happens in the action's result processing,
# not in the CLI -- `codeql database analyze --codescanning-config` reads
# queries from the config and ignores its path filters -- so this cannot be
# reproduced with a local CLI run. An unfiltered scan of this tree reports 151
# pack findings, 56 of them in generated files; the first CI run should report
# 95.
paths-ignore:
  - api
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/*.pulsar.go"
