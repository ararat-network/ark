# Builds the image from the working tree, runs the four-validator localnet
# with its price-feed sidecars, and asserts liveness, the emergency submission
# runbook, and a state-sync restore against it. State sync goes last: it needs
# node0 past a snapshot height, which the earlier steps have already taken.
name: Localnet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localnet:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version stamps
        id: stamps
        run: |
          echo "version=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "pricefeed_version=$(git describe --tags --match 'pricefeed/v[0-9]*' --always --dirty | sed 's|^pricefeed/||')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ark/arkd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: contrib/images/arkd-env/Dockerfile
          load: true
          tags: ark/arkd
          build-args: |
            VERSION=${{ steps.stamps.outputs.version }}
            PRICEFEED_VERSION=${{ steps.stamps.outputs.pricefeed_version }}
            COMMIT=${{ steps.stamps.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: make localnet-init
      - run: make localnet-up
      - run: make localnet-liveness
      - run: make localnet-runbook
      - run: make localnet-statesync

      - name: Container logs
        if: failure()
        run: docker compose -f contrib/localnet/docker-compose.yml logs --tail 200

      - name: Stop
        if: always()
        run: make localnet-stop
