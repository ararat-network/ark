# Builds the image from the working tree, runs the four-validator localnet
# with its price-feed sidecars, and asserts liveness, the emergency submission
# runbook, and a state-sync restore against it. State sync goes last: it needs
# node0 past a snapshot height, which the earlier steps have already taken.
name: Localnet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Version stamps
        id: stamps
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ark/arkd
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: contrib/images/arkd-env/Dockerfile
          load: true
          tags: ark/arkd
          build-args: |
            VERSION=${{ steps.stamps.outputs.version }}
            COMMIT=${{ steps.stamps.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: make localnet-init
      - run: make localnet-up
      - run: make localnet-liveness
      - run: make localnet-runbook
      - run: make localnet-statesync

      - name: Container logs
        if: failure()
        run: docker compose -f contrib/localnet/docker-compose.yml logs --tail 200

      - name: Stop
        if: always()
        run: make localnet-stop
