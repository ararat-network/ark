# Publishes the ark/arkd image to ghcr on every chain release, nightly when
# main moved, and on demand; sidecar releases (pricefeed/vX.Y.Z) are skipped.
# Tags are the release tag, the branch name, or `nightly`; there is never a
# `latest`, so nobody pulls a moving target.
name: Publish Docker image

on:
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-push:
    # GitHub attestations require a public repository on the current Free plan.
    # Keep publication paused while private; local image builds remain available.
    if: >-
      !github.event.repository.private &&
      (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'pricefeed/'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # Includes offline native-source verification for the published architecture.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Count commits since the last nightly
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            count=$(git log --oneline --since '24 hours ago' | wc -l | tr -d ' ')
          else
            count=1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Version stamps
        id: stamps
        if: steps.changes.outputs.count > 0
        run: |
          echo "version=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "pricefeed_version=$(git describe --tags --match 'pricefeed/v[0-9]*' --always --dirty | sed 's|^pricefeed/||')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.count > 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.count > 0
        with:
          go-version-file: go.mod

      - name: Package corresponding source
        if: steps.changes.outputs.count > 0
        run: |
          python3 -B contrib/scripts/package_source_test.py
          python3 -B contrib/scripts/package_os_source_test.py
          python3 contrib/scripts/package-source.py --kind image \
            --output "build/source/image-source-$(git rev-parse HEAD).tar.gz" \
            --image-context build/source-image

      - name: Verify corresponding source before publishing
        if: steps.changes.outputs.count > 0
        run: contrib/scripts/verify-source.sh "build/source/image-source-$(git rev-parse HEAD).tar.gz" image amd64

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.changes.outputs.count > 0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        if: steps.changes.outputs.count > 0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false

      - name: Build and upload image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.changes.outputs.count > 0
        with:
          context: build/source-image
          file: build/source-image/contrib/images/arkd-env/Dockerfile
          target: distribution
          # amd64 only: an emulated arm64 build of the chain takes most of an
          # hour. Add a native arm64 runner and a manifest merge when needed.
          platforms: linux/amd64
          # No release/nightly tags are moved until both attestations verify.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stamps.outputs.version }}
            PRICEFEED_VERSION=${{ steps.stamps.outputs.pricefeed_version }}
            COMMIT=${{ steps.stamps.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image SBOM
        if: steps.changes.outputs.count > 0
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ runner.temp }}/image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest image provenance
        if: steps.changes.outputs.count > 0
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        if: steps.changes.outputs.count > 0
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify registry attestations
        if: steps.changes.outputs.count > 0
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          policy=(--repo "$GITHUB_REPOSITORY"
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-push.yml"
                  --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
                  --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
                  --bundle-from-oci)
          gh attestation verify "$image" "${policy[@]}"
          gh attestation verify "$image" "${policy[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Publish verified image tags
        if: steps.changes.outputs.count > 0
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tags+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create --prefer-index=false "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/image-promotion.json" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          jq -e --arg digest "$IMAGE_DIGEST" \
            '."containerimage.descriptor".digest == $digest' \
            "$RUNNER_TEMP/image-promotion.json"
          printf 'Verified image: `%s/%s@%s`\n' \
            "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
