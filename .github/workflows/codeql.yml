# Static analysis. The query selection is deliberately wider than the default:
# CWE-369 divide-by-zero is pulled in because a division that faults inside a
# Begin- or EndBlocker halts the chain, and the cosmos-sdk pack carries checks
# for SDK-specific hazards a generic Go scanner has no concept of, such as
# non-deterministic map iteration reaching consensus state.
name: CodeQL

on:
  pull_request:
    paths: ["**.go"]
  push:
    branches: [main]
    paths: ["**.go"]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      # Required to publish findings into the repository's Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: go
          config-file: ./.github/codeql/config.yml
          # Every external reference is pinned. Queries are code that runs in
          # CI, and the cosmos-sdk pack is third-party and last published in
          # December 2023, so an unpinned reference is a dependency that can
          # change without a pull request. The query tag tracks the CLI the
          # action ships; bump both together.
          queries: >-
            +security-and-quality,
            github/codeql/go/ql/src/experimental/CWE-369/DivideByZero.ql@codeql-cli/v2.26.4,
            github/codeql/go/ql/src/experimental/Unsafe/WrongUsageOfUnsafe.ql@codeql-cli/v2.26.4,
            github/codeql/go/ql/src/experimental/InconsistentCode/DeferInLoop.ql@codeql-cli/v2.26.4
          packs: +crypto-com/cosmos-sdk-codeql@0.0.8

      - uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
