# Static analysis includes divide-by-zero and Cosmos SDK consensus checks in addition to the default
# Go suite. See tests/README.md for query selection and result scope.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      # Required to publish findings into the repository's Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          # Pin external queries and align the query tag with the action's CLI version. Query code
          # is part of the CI dependency boundary.
          queries: >-
            +security-and-quality,
            github/codeql/go/ql/src/experimental/CWE-369/DivideByZero.ql@codeql-cli/v2.26.4,
            github/codeql/go/ql/src/experimental/Unsafe/WrongUsageOfUnsafe.ql@codeql-cli/v2.26.4,
            github/codeql/go/ql/src/experimental/InconsistentCode/DeferInLoop.ql@codeql-cli/v2.26.4
          packs: +crypto-com/cosmos-sdk-codeql@0.0.8

      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # Uploaded once scoped below; failure-only still reports a failed analysis.
          upload: failure-only
          output: sarif-results

      - name: Scope results
        run: |
          python3 -B .github/codeql/scope_results_test.py
          python3 .github/codeql/scope-results.py sarif-results/*.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif-results
