# Builds and tests the CosmWasm contracts under contracts/ with the Rust
# mise.toml pins, validates the wasm against the chain's capabilities, then
# runs the optimizer image and checks that the artefact the application
# tests embed is its reproducible build of the source: the bytes a store
# proposal would cite.
name: Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "app/testdata/grant.wasm"
      - "mise.toml"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: cargo install cosmwasm-check --locked

      - run: make contracts-lint contracts-test contracts-build

      - run: make contracts-optimize

      - run: git diff --exit-code -- app/testdata/grant.wasm
