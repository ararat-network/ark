# Known-CVE scanning of the dependency tree. Nightly rather than per pull
# request on purpose: govulncheck reports findings whose upstream fix does not
# exist yet, so gating merges on it would leave a permanently red check that
# stops being read. A nightly run is the signal that a fix has shipped.
name: Vulncheck

on:
  schedule:
    # 04:00 UTC daily, an hour after the simulations.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make vulncheck
