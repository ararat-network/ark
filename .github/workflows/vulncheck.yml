# Known-CVE scanning of the dependency tree. Nightly rather than per pull
# request on purpose: govulncheck reports findings whose upstream fix does not
# exist yet, so gating merges on it would leave a permanently red check that
# stops being read. Reviewed findings live in contrib/scripts/vulncheck-accepted.json;
# the run fails on an unreviewed finding, or once an accepted one has a fix.
name: Vulncheck

on:
  schedule:
    # 04:00 UTC daily, an hour after the simulations.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by commit, like the CodeQL references: an action is code that
      # runs in CI. Tool versions come from mise.toml, so this workflow names
      # none of them and cannot drift from a developer's shell.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: make vulncheck

  report:
    needs: govulncheck
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/nightly-failure.yml
    with:
      workflow: Vulncheck
