# Go and protobuf linting. Both jobs run the same Makefile targets a
# developer runs, against the checked-in .golangci.yml and buf config, so a
# green run here means `make lint` and `make proto-lint` are green locally.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by commit, like the CodeQL references: an action is code that
      # runs in CI. Tool versions come from mise.toml, so this workflow names
      # none of them and cannot drift from a developer's shell.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - run: make lint

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: make proto-lint
