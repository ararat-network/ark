# Application simulations. These run nightly rather than per pull request:
# each drives tens of thousands of blocks and takes minutes, and a failure
# is a property violation worth investigating rather than a merge blocker.
name: Sims

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          # Determinism first: it is the one whose failure invalidates the
          # others' results rather than standing on its own.
          - test-sim-nondeterminism
          - test-sim
          - test-sim-import-export
          - test-sim-after-import
          - test-sim-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: make ${{ matrix.target }}

  report:
    needs: sim
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/nightly-failure.yml
    with:
      workflow: Sims
