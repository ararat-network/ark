name: Prepare signed binary release

# Dispatch against an existing reviewed tag, never an arbitrary checkout input.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # GitHub attestations require public visibility on the current Free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || {
            echo '::error::Dispatch this workflow with --ref vX.Y.Z or --ref pricefeed/vX.Y.Z'
            exit 1
          }
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          kind=$(python3 -B contrib/scripts/release-assets.py identity "$GITHUB_REF_NAME" "$GITHUB_SHA")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' "$RUNNER_TEMP/releases.json"

      - name: Make room for native source builds
        run: |
          # Disposable GitHub-hosted runner only; these toolchains are not used here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go goreleaser syft
          cache: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: steps.release.outputs.kind == 'arkd'
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Build and stage complete release assets
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
        run: |
          python3 -B contrib/scripts/release_assets_test.py
          if [ "$RELEASE_KIND" = arkd ]; then
            make release
          else
            make release-pricefeed
          fi
          python3 -B contrib/scripts/release-assets.py stage "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/release"

      - name: Attest all release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
        run: |
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/release/provenance.sigstore.json"
          # Refuse an existing draft or publication, including one created during the build.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' "$RUNNER_TEMP/releases.json"
          python3 -B contrib/scripts/release-assets.py verify "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/release" > "$RUNNER_TEMP/assets.txt"
          {
            echo 'Verification pending. Do not publish until this workflow succeeds.'
            echo
            printf 'Source revision: `%s`.\n\n' "$GITHUB_SHA"
            if [ "$RELEASE_KIND" = arkd ]; then
              echo 'The combined arkd executable is distributed under GPLv3; Ark-authored source is Apache-2.0.'
              echo 'Retain the attached application and per-architecture runtime source bundles with the binaries.'
            else
              echo 'Ark-authored source is Apache-2.0; third-party components retain their licences.'
              echo 'Corresponding source and third-party notices are attached.'
            fi
            printf '\n[Verification instructions](https://github.com/%s/blob/%s/docs/operations/RELEASE_VERIFICATION.md).\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$RUNNER_TEMP/release-notes.md"
          flags=(--draft --verify-tag --latest=false --title "$GITHUB_REF_NAME"
                 --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "$RUNNER_TEMP/release/"*

      - name: Verify uploaded assets and leave the draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/downloaded-release"
          python3 -B contrib/scripts/release-assets.py verify "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/downloaded-release" > "$RUNNER_TEMP/downloaded-assets.txt"
          policy=(--repo "$GITHUB_REPOSITORY"
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
                  --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
                  --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
                  --bundle "$RUNNER_TEMP/downloaded-release/provenance.sigstore.json")
          while IFS= read -r name; do
            gh attestation verify "$RUNNER_TEMP/downloaded-release/$name" "${policy[@]}"
          done < "$RUNNER_TEMP/downloaded-assets.txt"
          # Compare with the staged bytes too: a concurrently modified draft is not accepted.
          cmp "$RUNNER_TEMP/assets.txt" "$RUNNER_TEMP/downloaded-assets.txt"
          while IFS= read -r name; do
            cmp "$RUNNER_TEMP/release/$name" "$RUNNER_TEMP/downloaded-release/$name"
          done < "$RUNNER_TEMP/assets.txt"
          cmp "$RUNNER_TEMP/release/provenance.sigstore.json" \
            "$RUNNER_TEMP/downloaded-release/provenance.sigstore.json"
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft | grep -qx true
          sed '1c\All attached release assets passed checksum and signed provenance verification. Awaiting maintainer publication.' \
            "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/verified-release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/verified-release-notes.md"
          printf 'Verified draft `%s` at `%s`. Review and publish through GitHub Releases.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
