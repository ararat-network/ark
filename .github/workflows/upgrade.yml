# Nightly cosmovisor rehearsal builds old/new binaries and runs a governance upgrade. Without a
# registered app/upgrade/v* package, it reports no plan to rehearse. See contrib/scripts/README.md.
name: Upgrade

on:
  schedule:
    # 04:00 UTC daily, after the sims.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The script builds the old binary from a git ref through a worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Plan to rehearse
        id: plan
        run: |
          name=$(ls -d app/upgrade/v* 2>/dev/null | sed 's|.*/||' | sort -V | tail -1)
          if [ -z "$name" ]; then
            echo "no app/upgrade/v* package yet; nothing to rehearse" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rehearsing $name" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Rehearse
        if: steps.plan.outputs.name != ''
        run: make upgrade-rehearsal
        env:
          UPGRADE_NAME: ${{ steps.plan.outputs.name }}

      - name: Node log
        if: failure()
        run: tail -200 build/upgrade-rehearsal/node.log || true

  report:
    needs: rehearsal
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/nightly-failure.yml
    with:
      workflow: Upgrade
