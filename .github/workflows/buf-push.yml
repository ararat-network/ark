name: buf-push

# Pushes the proto module to the Buf Schema Registry on every chain tag,
# labelled with the tag. Lint, format, and breaking checks run in lint.yml
# through the proto-builder; this job only publishes what the tag holds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  push:
    name: Push the proto module to the Buf registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          input: proto
          push: true
          push_disable_create: true
          lint: false
          format: false
          breaking: false
          pr_comment: false
