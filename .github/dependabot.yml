version: 2
updates:
  # Actions are pinned by commit with the version as a trailing comment, so a
  # tag moving under a workflow cannot change what runs; these bumps move the
  # commit and the comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Weekly rather than daily: a chain's dependency bumps need the full suite
  # and the simulations behind them, and a queue of open bumps competing for
  # that is worse than a smaller batch.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # The localnet image pins its base images by digest, so this is what moves
  # them when a patch release lands.
  - package-ecosystem: docker
    directory: "/contrib/images/arkd-env"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
