[package]
name = "ark-grant"
version = "0.1.0"
description = "Vesting grants and the contributor escrow of the NOAH distribution plan"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Disables the entry points so another crate can link this one as a library.
library = []

[dependencies]
cosmwasm-schema = "2.2"
cosmwasm-std = { version = "2.2", features = ["cosmwasm_2_1", "stargate"] }
cw-storage-plus = "2.0"
cw2 = "2.0"
cosmos-sdk-proto = { version = "0.27", default-features = false }
prost = "0.13"
schemars = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
cw-multi-test = { version = "2.3", features = ["cosmwasm_2_0", "stargate"] }
