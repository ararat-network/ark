[workspace]
resolver = "3"
members = ["grant"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ararat-network/ark"
rust-version = "1.86"

# The CosmWasm release profile: a deterministic, small, panic-free binary.
[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
