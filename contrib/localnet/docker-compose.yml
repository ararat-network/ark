# Each validator has a sidecar; make localnet-init prepares homes. The multi
# profile adds node1..3; without it, node0 matches VALIDATORS=1.
name: ark-localnet

x-arkd: &arkd
  image: ark/arkd
  volumes:
    - ${ARK_LOCALNET_DATA:-../../.testnets}:/data

x-pricefeed: &pricefeed
  image: ark/arkd
  entrypoint: ["pricefeed"]
  volumes:
    - ${ARK_LOCALNET_DATA:-../../.testnets}:/data

services:
  node0:
    <<: *arkd
    container_name: ark-node0
    environment: [ID=0]
    ports: ["26656-26657:26656-26657", "1317:1317", "9090:9090", "9464:9464", "26660:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.2}}
  node1:
    <<: *arkd
    container_name: ark-node1
    profiles: [multi]
    environment: [ID=1]
    ports: ["26666-26667:26656-26657", "1318:1317", "9091:9090", "9465:9464", "26670:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.3}}
  node2:
    <<: *arkd
    container_name: ark-node2
    profiles: [multi]
    environment: [ID=2]
    ports: ["26676-26677:26656-26657", "1319:1317", "9092:9090", "9466:9464", "26680:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.4}}
  node3:
    <<: *arkd
    container_name: ark-node3
    profiles: [multi]
    environment: [ID=3]
    ports: ["26686-26687:26656-26657", "1320:1317", "9093:9090", "9467:9464", "26690:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.5}}

  pricefeed0:
    <<: *pricefeed
    container_name: ark-pricefeed0
    command: ["start", "--config", "/data/node0/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext", "--metrics", "--metrics-address", "0.0.0.0:9091"]
    networks: {localnet: {ipv4_address: 192.168.10.12}}
  pricefeed1:
    <<: *pricefeed
    container_name: ark-pricefeed1
    profiles: [multi]
    command: ["start", "--config", "/data/node1/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext", "--metrics", "--metrics-address", "0.0.0.0:9091"]
    networks: {localnet: {ipv4_address: 192.168.10.13}}
  pricefeed2:
    <<: *pricefeed
    container_name: ark-pricefeed2
    profiles: [multi]
    command: ["start", "--config", "/data/node2/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext", "--metrics", "--metrics-address", "0.0.0.0:9091"]
    networks: {localnet: {ipv4_address: 192.168.10.14}}
  pricefeed3:
    <<: *pricefeed
    container_name: ark-pricefeed3
    profiles: [multi]
    command: ["start", "--config", "/data/node3/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext", "--metrics", "--metrics-address", "0.0.0.0:9091"]
    networks: {localnet: {ipv4_address: 192.168.10.15}}

  # State-sync client behind the "statesync" profile: a non-validator that
  # bootstraps from node0's snapshots instead of replaying from genesis.
  # statesync.sh builds its home and trust anchor at start. Needs the
  # four-validator shape, since the light client wants two RPC servers.
  sync0:
    image: ark/arkd
    container_name: ark-sync0
    profiles: [statesync]
    depends_on: [node0]
    entrypoint: ["sh", "/statesync.sh"]
    volumes:
      - ${ARK_LOCALNET_DATA:-../../.testnets}:/data
      - ./statesync.sh:/statesync.sh:ro
    ports: ["26696-26697:26656-26657"]
    networks: {localnet: {ipv4_address: 192.168.10.22}}

  # Prometheus, Alertmanager, and Grafana behind the "observability" profile,
  # scraping every node and sidecar with contrib/observability's rules. Host
  # ports sit clear of the nodes' gRPC range. Grafana is anonymous read-only;
  # admin/localnet edits.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ark-prometheus
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ../observability/prometheus.localnet.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
    ports: ["9095:9090"]
    networks: {localnet: {ipv4_address: 192.168.10.32}}
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ark-alertmanager
    profiles: [observability]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9096:9093"]
    networks: {localnet: {ipv4_address: 192.168.10.33}}
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ark-grafana
    profiles: [observability]
    environment: [GF_AUTH_ANONYMOUS_ENABLED=true, GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer, GF_SECURITY_ADMIN_PASSWORD=localnet]
    volumes:
      - ../observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/ark.yml:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: {localnet: {ipv4_address: 192.168.10.34}}

networks:
  localnet:
    name: ark-localnet
    ipam:
      config:
        - subnet: 192.168.10.0/24
