# Four validators, each paired with its own price-feed sidecar. Homes come
# from `make localnet-init`, which connects the public validator mesh through
# a dedicated sentry to the carrier on its separate network.
# node1..3 and their sidecars carry the "multi" profile: without it only node0
# starts, which is the single-validator shape `VALIDATORS=1` generates.
name: ark-localnet

x-arkd: &arkd
  image: ark/arkd
  volumes:
    - ${ARK_LOCALNET_DATA:-../../.testnets}:/data

x-pricefeed: &pricefeed
  image: ark/arkd
  entrypoint: ["pricefeed"]
  volumes:
    - ${ARK_LOCALNET_DATA:-../../.testnets}:/data

services:
  node0:
    <<: *arkd
    container_name: ark-node0
    environment: [ID=0]
    ports: ["26656-26657:26656-26657", "1317:1317", "9090:9090", "9464:9464", "26660:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.2}}
  node1:
    <<: *arkd
    container_name: ark-node1
    profiles: [multi]
    environment: [ID=1]
    ports: ["26666-26667:26656-26657", "1318:1317", "9091:9090", "9465:9464", "26670:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.3}}
  node2:
    <<: *arkd
    container_name: ark-node2
    profiles: [multi]
    environment: [ID=2]
    ports: ["26676-26677:26656-26657", "1319:1317", "9092:9090", "9466:9464", "26680:26660"]
    networks: {localnet: {ipv4_address: 192.168.10.4}}
  # Only the dedicated sentry reaches the carrier over P2P. RPC is host-loopback
  # for the rehearsal; production uses an authenticated private network.
  node3:
    <<: *arkd
    container_name: ark-node3
    profiles: [multi]
    environment: [ID=3]
    ports: ["127.0.0.1:26687:26657", "127.0.0.1:1320:1317", "127.0.0.1:9093:9090", "127.0.0.1:9467:9464", "127.0.0.1:26690:26660"]
    networks: {carrier: {ipv4_address: 192.168.11.3}}

  pricefeed0:
    <<: *pricefeed
    container_name: ark-pricefeed0
    command: ["start", "--config", "/data/node0/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext"]
    networks: {localnet: {ipv4_address: 192.168.10.12}}
  pricefeed1:
    <<: *pricefeed
    container_name: ark-pricefeed1
    profiles: [multi]
    command: ["start", "--config", "/data/node1/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext"]
    networks: {localnet: {ipv4_address: 192.168.10.13}}
  pricefeed2:
    <<: *pricefeed
    container_name: ark-pricefeed2
    profiles: [multi]
    command: ["start", "--config", "/data/node2/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext"]
    networks: {localnet: {ipv4_address: 192.168.10.14}}
  pricefeed3:
    <<: *pricefeed
    container_name: ark-pricefeed3
    profiles: [multi]
    command: ["start", "--config", "/data/node3/pricefeed/pricefeed.toml", "--address", "0.0.0.0:8080", "--tls-mode", "plaintext"]
    networks: {carrier: {ipv4_address: 192.168.11.13}}

  # Relays blocks, votes and proposals, but no pending transactions to carrier.
  carrier-sentry:
    <<: *arkd
    container_name: ark-carrier-sentry
    profiles: [multi]
    environment: [ARKD_HOME=/data/carrier-sentry/arkd]
    networks:
      localnet: {ipv4_address: 192.168.10.6}
      carrier: {ipv4_address: 192.168.11.2}

  runbook:
    <<: *arkd
    profiles: [rehearsal]
    entrypoint: ["sh", "/runbook.sh"]
    volumes:
      - ${ARK_LOCALNET_DATA:-../../.testnets}:/data
      - ../scripts/runbook-emergency-suspend.sh:/runbook.sh:ro
      - ../scripts/localnet-fill-mempool.sh:/fill-mempool.sh:ro
    networks: [localnet, carrier]

  # State-sync client behind the "statesync" profile: a non-validator that
  # bootstraps from node0's snapshots instead of replaying from genesis.
  # statesync.sh builds its home and trust anchor at start. Needs the
  # four-validator shape, since the light client wants two RPC servers.
  sync0:
    image: ark/arkd
    container_name: ark-sync0
    profiles: [statesync]
    depends_on: [node0]
    entrypoint: ["sh", "/statesync.sh"]
    volumes:
      - ${ARK_LOCALNET_DATA:-../../.testnets}:/data
      - ./statesync.sh:/statesync.sh:ro
    ports: ["26696-26697:26656-26657"]
    networks: {localnet: {ipv4_address: 192.168.10.22}}

networks:
  localnet:
    # Fixed so `make localnet-runbook` can join it by name.
    name: ark-localnet
    ipam:
      config:
        - subnet: 192.168.10.0/24
  carrier:
    name: ark-carrier
    ipam:
      config:
        - subnet: 192.168.11.0/24
