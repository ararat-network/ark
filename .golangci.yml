version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        # api/ pulsar output is depinject/autocli wiring only; module logic
        # imports the gogo types in x/*/types.
        pulsar-api:
          files:
            - "**/x/**"
            - "**/abci/**"
            - "**/pricefeed/**"
            - "**/pkg/**"
            - "!**/module/**"
          deny:
            - pkg: github.com/ararat-network/ark/api
              desc: pulsar-generated code is wiring-only — import x/*/types instead
        legacy:
          deny:
            - pkg: github.com/tendermint/tendermint
              desc: use cometbft and cosmossdk.io/log
            - pkg: gopkg.in/yaml.v2
              desc: YAML marshaling on types was removed with the Classic port
            - pkg: github.com/cosmos/cosmos-sdk/x/params
              desc: params are collections-based module params
    dogsled:
      max-blank-identifiers: 3
    goconst:
      # Three scattered data-table occurrences are not worth a shared constant;
      # duplication in test fixtures is not worth one either.
      min-occurrences: 4
      ignore-tests: true
    gocritic:
      disabled-checks:
        - regexpMust
        - appendAssign
        - ifElseChain
    gosec:
      excludes:
        - G101 # hardcoded credentials — false positives on test mnemonics/keys
        - G107 # variable URL in HTTP request — legitimate in clients
        - G115 # integer overflow conversion — too noisy in blockchain math
        - G404 # weak random number generator — math/rand is fine for non-crypto
      confidence: medium
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: dot-imports
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: empty-block
    unused:
      local-variables-are-used: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: "or be unexported"
      - linters:
          - nolintlint
        text: leading space
      # Tests dot-import the package under test by convention.
      - path: _test\.go$
        linters:
          - revive
        text: "dot-imports"
      # autocli files are declarative arg tables; repeated field names there
      # are data, not magic strings.
      - path: module/autocli\.go$
        linters:
          - goconst
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cometbft/cometbft)
        - prefix(cosmossdk.io)
        - prefix(github.com/cosmos/cosmos-sdk)
        - prefix(github.com/ararat-network/ark)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
