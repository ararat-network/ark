<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 632" width="972" height="632" role="img" aria-labelledby="title">
  <title id="title">Ark symbol construction</title>
  <rect width="100%" height="100%" fill="#F6F3EC"/>
  <g transform="translate(60 60) scale(2.0)"><path fill="#1E3A7B" d="M128 18L208 98L48 98Z"/>
  <path fill="#1E3A7B" d="M16 110H48L128 190L208 110H240A112 112 0 0 1 16 110Z"/></g>
  <circle cx="316" cy="280" r="224" fill="none" stroke="#B4532A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="36" y1="268" x2="596" y2="268" fill="none" stroke="#B4532A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polygon points="316,96 488,268 316,440 144,268" fill="none" stroke="#B4532A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="642.0" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1A2E">Hull</text>
  <text x="642.0" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">half of one circle, radius 112, cut</text>
  <text x="642.0" y="145" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">flat at the waterline</text>
  <text x="642.0" y="188" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1A2E">Peak</text>
  <text x="642.0" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">45-degree sides, 80 high</text>
  <text x="642.0" y="255" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1A2E">Notch</text>
  <text x="642.0" y="279" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">the peak reflected across the</text>
  <text x="642.0" y="300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">waterline; together they make the</text>
  <text x="642.0" y="321" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">dashed diamond</text>
  <text x="642.0" y="364" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1A2E">Gap</text>
  <text x="642.0" y="388" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">12 on the 256 grid; the small</text>
  <text x="642.0" y="409" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">drawing widens it to 24</text>
  <text x="642.0" y="452" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1A2E">Waterline</text>
  <text x="642.0" y="476" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">the dashed horizontal line, halfway</text>
  <text x="642.0" y="497" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F1A2E">through the gap</text>
</svg>
