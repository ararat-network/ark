version: 2

project_name: pricefeed

# Package the pure-Go sidecar from pricefeed/vX.Y.Z through make release-pricefeed. Templates use
# .Tag because prefixed tags require explicit selection and validated skip handling. See README.md,
# "Release builds".

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  # Chain releases stay the repository's latest.
  make_latest: false
  header: |
    Ark-authored source is Apache-2.0; third-party components retain their licences.
    Corresponding source and notices are attached as pricefeed-source-{{ .FullCommit }}*.tar.gz.
  extra_files: &source_files
    - glob: build/source/pricefeed-source-{{ .FullCommit }}.tar.gz
    - glob: build/source/pricefeed-source-{{ .FullCommit }}.tar.gz.sha256
    - glob: build/source/pricefeed-source-{{ .FullCommit }}-notices.tar.gz

before:
  hooks:
    - go mod verify
    - python3 -B contrib/scripts/package_source_test.py
    - python3 contrib/scripts/package-source.py --kind pricefeed --output build/source/pricefeed-source-{{ .FullCommit }}.tar.gz
    - contrib/scripts/verify-source.sh build/source/pricefeed-source-{{ .FullCommit }}.tar.gz pricefeed

builds:
  - id: pricefeed
    main: ./cmd/pricefeed
    binary: pricefeed
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
    ldflags:
      # A snapshot stamps its snapshot version; a release stamps the tag's own version.
      - '-X github.com/cosmos/cosmos-sdk/version.Version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ trimprefix .Tag "pricefeed/" }}{{ end }}'
      - "-X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }}"
      - "-w"
      - "-s"

archives:
  - id: pricefeed
    ids:
      - pricefeed
    name_template: 'pricefeed-{{ trimprefix .Tag "pricefeed/v" }}-{{ .Os }}-{{ .Arch }}'
    files:
      - README.md
      - LICENSE
      - COPYING
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - build/source/pricefeed-source-{{ .FullCommit }}-notices.tar.gz

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: 'SHA256SUMS-pricefeed-{{ trimprefix .Tag "pricefeed/v" }}.txt'
  algorithm: sha256
  extra_files: *source_files

snapshot:
  version_template: '{{ trimprefix .Tag "pricefeed/v" }}-snapshot-{{ .ShortCommit }}'

changelog:
  disable: true
