version: 2

project_name: arkd

# Release arkd from vX.Y.Z inside a musl container with matching wasmvm static libraries.
# GORELEASER_CURRENT_TAG selects the chain tag explicitly; sidecar releases use their own config.
# See README.md, "Release builds".

release:
  name_template: "{{ .Tag }}"

before:
  hooks:
    - go mod verify

builds:
  - id: arkd-amd64
    main: ./cmd/arkd
    binary: arkd
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-musl-gcc
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
      - ledger
      - muslc
    ldflags:
      # version.Name and version.AppName are chain identity, set in
      # app/config.go rather than stamped here.
      - "-X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}"
      - "-X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }}"
      - '-X "github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger,muslc"'
      - '-X github.com/cometbft/cometbft/version.TMCoreSemVer={{ envOrDefault "CMT_VERSION" "" }}'
      - "-w"
      - "-s"
      - "-linkmode=external"
      - '-extldflags "-Wl,-z,muslsymversions -static"'

  - id: arkd-arm64
    main: ./cmd/arkd
    binary: arkd
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-musl-gcc
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
      - ledger
      - muslc
    ldflags:
      - "-X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}"
      - "-X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }}"
      - '-X "github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger,muslc"'
      - '-X github.com/cometbft/cometbft/version.TMCoreSemVer={{ envOrDefault "CMT_VERSION" "" }}'
      - "-w"
      - "-s"
      - "-linkmode=external"
      - '-extldflags "-Wl,-z,muslsymversions -static"'

archives:
  - id: arkd
    ids:
      - arkd-amd64
      - arkd-arm64
    name_template: "arkd-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "SHA256SUMS-{{ .Version }}.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true
