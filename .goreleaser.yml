version: 2

project_name: arkd

release:
  name_template: "{{.Tag}}"

before:
  hooks:
    - go mod tidy

builds:
  - id: arkd
    main: ./cmd/arkd
    binary: arkd
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - LEDGER_ENABLED=true
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
      - ledger
    ldflags:
      - "-X github.com/cosmos/cosmos-sdk/version.Name=ark"
      - "-X github.com/cosmos/cosmos-sdk/version.AppName=arkd"
      - "-X github.com/cosmos/cosmos-sdk/version.Version={{.Version}}"
      - "-X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}"
      - '-X "github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger"'
      - "-w"
      - "-s"

  # The oracle sidecar is an off-chain process: no ledger support, and a static
  # binary so it can be dropped into a minimal container alongside the node.
  - id: oracle
    main: ./cmd/oracle
    binary: oracle
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
    ldflags:
      - "-X github.com/cosmos/cosmos-sdk/version.Version={{.Version}}"
      - "-X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}"
      - "-w"
      - "-s"

archives:
  - id: arkd
    ids:
      - arkd
    name_template: '{{ replace .Version "arkd/" "arkd-" }}-{{ .Os }}-{{ .Arch }}'
  - id: oracle
    ids:
      - oracle
    name_template: 'oracle-{{ replace .Version "arkd/" "arkd-" }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: 'SHA256SUMS-{{ replace .Version "arkd/" "arkd-" }}.txt'
  algorithm: sha256

changelog:
  disable: true
