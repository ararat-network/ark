version: 2

project_name: arkd

# Release arkd from vX.Y.Z through make release, inside a musl container that provides the cross
# toolchains and both wasmvm static archives; the before hook holds the archives to the version and
# digests recorded in contrib/images/arkd-env/Dockerfile. See README.md, "Release builds".

release:
  name_template: "{{ .Tag }}"
  prerelease: auto

before:
  hooks:
    - go mod verify
    - contrib/scripts/check-wasmvm-libs.sh

builds:
  - id: arkd
    main: ./cmd/arkd
    binary: arkd
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - 'CC={{ if eq .Arch "arm64" }}aarch64-linux-musl-gcc{{ else }}x86_64-linux-musl-gcc{{ end }}'
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -mod=readonly
    tags:
      - netgo
      - ledger
      - muslc
    ldflags:
      # version.Name and version.AppName are chain identity, set in app/config.go.
      - -X github.com/cosmos/cosmos-sdk/version.Version=v{{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }}
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger,muslc
      - -w
      - -s
      - -linkmode=external
      - '-extldflags "-Wl,-z,muslsymversions -static"'

archives:
  - id: arkd
    ids:
      - arkd
    name_template: "arkd-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "SHA256SUMS-{{ .Version }}.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true
