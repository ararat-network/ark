# Pin the shared local/CI toolchain here and keep Go aligned with go.mod. Scanners must support that
# Go version; Go-only workflows read go.mod directly.
[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
# goreleaser reads one tag per run and its tag handling has shifted between
# minors, so `make release-pricefeed` is pinned to what it was written against.
goreleaser = "2.18.0"
# Generates per-archive SPDX inventories for standalone release packaging.
syft = "1.51.1"
# Installed from source by mise's Go backend with the pinned toolchain, so govulncheck can parse
# this module's sources.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
